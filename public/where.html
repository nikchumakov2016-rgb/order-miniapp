<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Где купить — Римские Пельмени</title>
  <meta name="description" content="Где купить полуфабрикаты «Римские Пельмени»: магазины Саракташа и Саракташского района, торговые точки в Оренбурге. Адреса для уточнения наличия.">
  <link rel="canonical" href="https://rimskie-pelmeni.ru/where.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fbf2e8;
      color: #2f2723;
      min-height: 100vh;
    }

    /* ── layout ── */
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    @media (max-width: 600px) {
      .page { padding: 0 0 60px; }
    }

    /* ── back bar ── */
    .back-bar {
      padding: 10px 0 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .back-bar { padding: 14px 16px; }
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #7d6f66;
      text-decoration: none;
      background: rgba(139,42,31,0.06);
      border: 1px solid rgba(139,42,31,0.10);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(139,42,31,0.11); color: #2f2723; }
    .back-brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: #8B2A1F;
      letter-spacing: 0.2px;
    }

    /* ── hero ── */
    .hero {
      padding: 8px 0 8px;
      max-width: 640px;
    }
    @media (max-width: 600px) {
      .hero { padding: 6px 16px 8px; }
    }
    .hero-h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 52px;
      font-weight: 700;
      line-height: 1.08;
      color: #1c110a;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    @media (max-width: 600px) { .hero-h1 { font-size: 34px; } }
    .hero-lead {
      font-size: 15px;
      line-height: 1.65;
      color: #4a3e38;
    }
    @media (max-width: 600px) { .hero-lead { font-size: 14px; } }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: rgba(139,42,31,0.10);
      margin: 10px 0 20px;
    }
    @media (max-width: 600px) {
      .divider { margin: 8px 16px 16px; }
    }

    /* ── points grid ── */
    .points-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 36px;
    }
    @media (max-width: 720px) {
      .points-grid { grid-template-columns: 1fr; margin: 0 16px 28px; }
    }

    /* ── point card ── */
    .point-card {
      background: rgba(255,250,244,0.85);
      border: 1px solid rgba(139,42,31,0.12);
      border-radius: 18px;
      padding: 18px 20px;
      box-shadow: 0 3px 14px rgba(80,45,25,0.05);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .point-city {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #8B2A1F;
      opacity: 0.7;
    }
    .point-name {
      font-size: 15px;
      font-weight: 700;
      color: #1c110a;
      line-height: 1.3;
      margin-top: 2px;
    }
    .point-address {
      font-size: 13px;
      color: #6b5a52;
      line-height: 1.5;
      margin-top: 2px;
    }
    .point-note {
      font-size: 12px;
      color: #8B2A1F;
      opacity: 0.8;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* ── map link ── */
    .point-map-link {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      font-weight: 600;
      color: #8B2A1F;
      text-decoration: none;
      border: 1px solid rgba(139,42,31,0.25);
      border-radius: 999px;
      padding: 5px 12px;
      align-self: flex-start;
      transition: background 0.15s;
    }
    .point-map-link:hover { background: rgba(139,42,31,0.07); }

    /* ── loading / error ── */
    .state-msg {
      font-size: 14px;
      color: #7d6f66;
      padding: 16px 0;
    }
    @media (max-width: 720px) { .state-msg { padding: 16px; } }

    /* ── cta section ── */
    .cta-section {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media (max-width: 600px) {
      .cta-section { padding: 0 16px; flex-direction: column; }
    }
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 180px;
      background: #8B2A1F;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 16px;
      letter-spacing: 0.1px;
      transition: opacity 0.15s;
    }
    .cta-btn:hover { opacity: 0.88; }
    .cta-btn-secondary {
      background: rgba(139,42,31,0.07);
      color: #8B2A1F;
      border: 1px solid rgba(139,42,31,0.15);
    }
    .cta-btn-secondary:hover { background: rgba(139,42,31,0.13); opacity: 1; }
    @media (max-width: 600px) {
      .cta-btn { font-size: 15px; padding: 15px 20px; border-radius: 14px; min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- back bar -->
    <div class="back-bar">
      <a href="/" class="back-btn">← Назад</a>
      <span class="back-brand">Римские Пельмени</span>
    </div>

    <!-- hero -->
    <div class="hero">
      <h1 class="hero-h1">Где купить</h1>
      <p class="hero-lead" id="wtb-description">Продукцию «Римских пельменей» можно найти в магазинах Саракташа, Саракташского района и в торговых точках Оренбурга.<br>Ниже указаны точки в Оренбурге — наличие и ассортимент лучше уточнять заранее.</p>
    </div>

    <div class="divider"></div>

    <!-- points -->
    <div id="points-container">
      <div class="state-msg">Загружаем...</div>
    </div>

    <!-- cta -->
    <div class="cta-section">
      <a href="tel:+79228810468" class="cta-btn">Позвонить</a>
      <a href="/" class="cta-btn cta-btn-secondary">На витрину →</a>
    </div>

  </div>

  <script>
    const FALLBACK = {
      description: "Продукцию «Римских пельменей» можно найти в магазинах Саракташа, Саракташского района и в торговых точках Оренбурга.\nНиже указаны точки в Оренбурге — наличие и ассортимент лучше уточнять заранее.",
      points: [
        { city: "Оренбург", name: "Гармония",                  address: "ДНТ Лидиния, ул. Плодовая, 39",        note: "",                     map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%20%D0%94%D0%9D%D0%A2%20%D0%9B%D0%B8%D0%B4%D0%B8%D0%BD%D0%B8%D1%8F%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9F%D0%BB%D0%BE%D0%B4%D0%BE%D0%B2%D0%B0%D1%8F%2039" },
        { city: "Оренбург", name: "Домашкино",                 address: "ул. Мясокомбинат, д. 1",               note: "",                     map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9C%D1%8F%D1%81%D0%BE%D0%BA%D0%BE%D0%BC%D0%B1%D0%B8%D0%BD%D0%B0%D1%82%201" },
        { city: "Оренбург", name: "Фрэш Маркет",               address: "Северный проезд, 18/1",                note: "",                     map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%20%D0%A1%D0%B5%D0%B2%D0%B5%D1%80%D0%BD%D1%8B%D0%B9%20%D0%BF%D1%80%D0%BE%D0%B5%D0%B7%D0%B4%2018%2F1" },
        { city: "Оренбург", name: "Продуктовый отдел",         address: "ул. Орлова, д. 5",                     note: "",                     map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9E%D1%80%D0%BB%D0%BE%D0%B2%D0%B0%205" },
        { city: "Оренбург", name: "Продукты 24",               address: "ул. Постникова, д. 20",                note: "",                     map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9F%D0%BE%D1%81%D1%82%D0%BD%D0%B8%D0%BA%D0%BE%D0%B2%D0%B0%2020" },
        { city: "пос. Аэропорт", name: "Магазин у Дома",       address: "ул. Центральная, д. 4", note: "",                     map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%D1%81%D0%BA%D0%B8%D0%B9%20%D1%80%D0%B0%D0%B9%D0%BE%D0%BD%20%D0%BF%D0%BE%D1%81%D1%91%D0%BB%D0%BE%D0%BA%20%D0%90%D1%8D%D1%80%D0%BE%D0%BF%D0%BE%D1%80%D1%82%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%A6%D0%B5%D0%BD%D1%82%D1%80%D0%B0%D0%BB%D1%8C%D0%BD%D0%B0%D1%8F%204" },
        { city: "Оренбург", name: "ТЦ «Мелодия», отдел Мясо", address: "ул. Туркестанская, 45",  note: "Есть фарш трёх видов", map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%A2%D1%83%D1%80%D0%BA%D0%B5%D1%81%D1%82%D0%B0%D0%BD%D1%81%D0%BA%D0%B0%D1%8F%2045" },
        { city: "Оренбург", name: "МЯСО&РЫБА",                address: "ул. Салмышская, 74",         note: "Есть шашлык: свинина на уксусе и свинина на лимоне",                     map_url: "https://yandex.ru/maps/?text=%D0%9E%D1%80%D0%B5%D0%BD%D0%B1%D1%83%D1%80%D0%B3%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%A1%D0%B0%D0%BB%D0%BC%D1%8B%D1%88%D1%81%D0%BA%D0%B0%D1%8F%2074%20%D0%9C%D0%AF%D0%A1%D0%9E%20%D0%A0%D0%AB%D0%91%D0%90" },
      ]
    };

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderPoints(data) {
      const container = document.getElementById("points-container");
      const descEl = document.getElementById("wtb-description");

      if (data.description) {
        descEl.innerHTML = data.description.split('\n')
          .map(s => escapeHtml(s.trim())).filter(s => s).join('<br>');
      }

      const points = (data.points || []).filter(p => p.name && p.address);
      if (!points.length) {
        container.innerHTML = '<div class="state-msg">Список точек уточняется. Позвоните нам — уточним наличие.</div>';
        return;
      }

      const grid = document.createElement("div");
      grid.className = "points-grid";

      points.forEach(p => {
        const card = document.createElement("div");
        card.className = "point-card";
        card.innerHTML =
          (p.city ? `<div class="point-city">${escapeHtml(p.city)}</div>` : "") +
          `<div class="point-name">${escapeHtml(p.name)}</div>` +
          `<div class="point-address">${escapeHtml(p.address)}</div>` +
          (p.note ? `<div class="point-note">${escapeHtml(p.note)}</div>` : "") +
          (p.map_url ? `<a class="point-map-link" href="${escapeHtml(p.map_url)}" target="_blank" rel="noopener noreferrer">Открыть на карте →</a>` : "");
        grid.appendChild(card);
      });

      container.innerHTML = "";
      container.appendChild(grid);
    }

    async function load() {
      try {
        const res = await fetch("/api/content/where-to-buy", { cache: "no-store" });
        if (!res.ok) throw new Error("api error");
        const data = await res.json();
        renderPoints(data);
      } catch {
        renderPoints(FALLBACK);
      }
    }

    load();
  </script>
</body>
</html>
