<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Акции — Римские Пельмени</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fbf2e8;
      color: #2f2723;
      min-height: 100vh;
    }

    /* ── layout ── */
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }
    @media (max-width: 600px) {
      .page { padding: 0 0 60px; }
    }

    /* ── back bar ── */
    .back-bar {
      padding: 10px 0 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    @media (max-width: 600px) {
      .back-bar { padding: 14px 16px; }
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #7d6f66;
      text-decoration: none;
      background: rgba(139,42,31,0.06);
      border: 1px solid rgba(139,42,31,0.10);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      transition: background 0.15s;
    }
    .back-btn:hover { background: rgba(139,42,31,0.11); color: #2f2723; }
    .back-brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: #8B2A1F;
      letter-spacing: 0.2px;
    }

    /* ── hero ── */
    .hero {
      padding: 8px 0 16px;
      max-width: 640px;
    }
    @media (max-width: 600px) {
      .hero { padding: 6px 16px 8px; }
    }
    .hero-h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 52px;
      font-weight: 700;
      line-height: 1.08;
      color: #1c110a;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    @media (max-width: 600px) { .hero-h1 { font-size: 34px; } }
    .hero-lead {
      font-size: 16px;
      line-height: 1.65;
      color: #4a3e38;
      margin-bottom: 0;
    }
    @media (max-width: 600px) { .hero-lead { font-size: 15px; } }

    /* ── divider ── */
    .divider {
      height: 1px;
      background: rgba(139,42,31,0.10);
      margin: 16px 0 20px;
    }
    @media (max-width: 600px) {
      .divider { display: none; }
    }

    /* ── promo banner ── */
    .promo-banner {
      margin: 0 0 28px;
      width: 100%;
    }
    .promo-banner img, .promo-banner picture {
      display: block;
      width: 100%;
    }
    .promo-banner img {
      width: 100%;
      height: auto;
      border-radius: 20px;
    }
    @media (max-width: 700px) {
      .promo-banner { margin: 0 0 20px; }
      .promo-banner img { border-radius: 14px; }
    }

    /* ── CTA ── */
    .cta-section {
      padding: 4px 0 0;
    }
    @media (max-width: 600px) {
      .cta-section { padding: 0 16px; }
    }
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #8B2A1F;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      padding: 18px 24px;
      border-radius: 18px;
      letter-spacing: 0.1px;
      transition: opacity 0.15s;
    }
    .cta-btn:hover { opacity: 0.88; }
    @media (max-width: 600px) {
      .cta-btn { font-size: 16px; padding: 17px 20px; border-radius: 14px; }
    }

  </style>
</head>
<body>
  <div class="page">

    <!-- back bar -->
    <div class="back-bar">
      <a href="/" class="back-btn">← Назад</a>
      <span class="back-brand">Римские Пельмени</span>
    </div>

    <!-- hero -->
    <div class="hero">
      <h1 class="hero-h1">Специальные предложения</h1>
    </div>

    <div class="divider"></div>

    <!-- promo banner -->
    <div class="promo-banner">
      <picture>
        <source media="(max-width: 700px)" srcset="/promo-labels-banner-mobile.png">
        <img src="/promo-labels-banner.png" alt="Акция: 10 этикеток = 1 кг продукции бесплатно" />
      </picture>
    </div>

    <!-- CTA -->
    <div class="cta-section">
      <a href="where.html" class="cta-btn">Посмотреть магазины →</a>
    </div>

  </div>

</body>
</html>
