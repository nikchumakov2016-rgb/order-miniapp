<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для магазинов и партнёров</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f7f5f2;
      color: #1a1a1a;
      min-height: 100vh;
    }
    .page { max-width: 480px; margin: 0 auto; padding: 0 0 60px; }
    .back-bar {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e8e3dc;
    }
    .back-btn {
      font-size: 14px; color: #555; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer; padding: 0;
    }
    .back-btn:hover { color: #1a1a1a; }
    .hero { padding: 28px 16px 20px; }
    .hero-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 28px; font-weight: 700;
      color: #1c110a; line-height: 1.2; margin-bottom: 10px;
    }
    .hero-subtitle {
      font-size: 15px; line-height: 1.6; color: #444; opacity: 0.85;
    }
    .section { padding: 16px 16px 4px; }
    .section-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: #888; margin-bottom: 10px;
    }
    .list-item {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 14px; line-height: 1.55; color: #1a1a1a;
      padding: 7px 0; border-bottom: 1px solid #ede8e0;
    }
    .list-item:last-child { border-bottom: none; }
    .list-icon { flex-shrink: 0; width: 20px; color: #888; font-style: normal; }
    .steps-list { counter-reset: steps; }
    .step-item {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 14px; line-height: 1.55; color: #1a1a1a;
      padding: 10px 0; border-bottom: 1px solid #ede8e0;
    }
    .step-item:last-child { border-bottom: none; }
    .step-num {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
      background: #ede8e0; color: #555;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; margin-top: 1px;
    }
    .docs-note {
      margin: 16px 16px 0;
      padding: 12px 14px;
      background: #ede8e0; border-radius: 10px;
      font-size: 13px; line-height: 1.5; color: #555;
    }
    .cta-bar {
      padding: 24px 16px 0;
      display: flex; gap: 10px;
    }
    .cta-btn {
      flex: 1; padding: 14px 0; border-radius: 12px; border: none;
      font-size: 15px; font-weight: 600; cursor: pointer;
      text-decoration: none; text-align: center;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .15s;
    }
    .cta-btn:hover { opacity: 0.88; }
    .cta-primary { background: #3390ec; color: #fff; }
    .cta-secondary { background: #ede8e0; color: #1a1a1a; }
    .unavailable {
      padding: 60px 24px; text-align: center;
      font-size: 15px; color: #888;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="back-bar">
    <button class="back-btn" onclick="history.length > 1 ? history.back() : location.href='/'">← Назад</button>
  </div>
  <div id="content">
    <div style="padding: 40px 16px; text-align: center; color: #aaa; font-size: 14px;">Загрузка...</div>
  </div>
</div>
<script>
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function renderCta(text, mode, value, cls) {
    if (!text || !value) return '';
    const href = mode === 'phone' ? `tel:${esc(value)}` : esc(value);
    const target = mode === 'link' ? ' target="_blank" rel="noreferrer"' : '';
    return `<a href="${href}"${target} class="cta-btn ${cls}">${esc(text)}</a>`;
  }

  function render(d) {
    if (!d.enabled) {
      document.getElementById('content').innerHTML =
        '<div class="unavailable">Страница временно недоступна.</div>';
      return;
    }

    const summary = (d.product_summary || []).map(x =>
      `<div class="list-item"><i class="list-icon">—</i><span>${esc(x)}</span></div>`
    ).join('');

    const benefits = (d.benefits || []).map(x =>
      `<div class="list-item"><i class="list-icon">✓</i><span>${esc(x)}</span></div>`
    ).join('');

    const whoFor = (d.who_its_for || []).map(x =>
      `<div class="list-item"><i class="list-icon">·</i><span>${esc(x)}</span></div>`
    ).join('');

    const steps = (d.steps || []).map((x, i) =>
      `<div class="step-item"><span class="step-num">${i+1}</span><span>${esc(x)}</span></div>`
    ).join('');

    const docsNote = d.docs_note
      ? `<div class="docs-note">${esc(d.docs_note)}</div>` : '';

    const primaryCta   = renderCta(d.cta_text,           d.cta_mode,           d.cta_value,           'cta-primary');
    const secondaryCta = renderCta(d.secondary_cta_text, d.secondary_cta_mode, d.secondary_cta_value, 'cta-secondary');
    const ctaBar = (primaryCta || secondaryCta)
      ? `<div class="cta-bar">${primaryCta}${secondaryCta}</div>` : '';

    document.title = esc(d.title);
    document.getElementById('content').innerHTML = `
      <div class="hero">
        <div class="hero-title">${esc(d.title)}</div>
        <div class="hero-subtitle">${esc(d.subtitle)}</div>
      </div>
      ${summary ? `<div class="section"><div class="section-title">О продукте</div>${summary}</div>` : ''}
      ${benefits ? `<div class="section"><div class="section-title">Почему выбирают</div>${benefits}</div>` : ''}
      ${whoFor ? `<div class="section"><div class="section-title">Кому подходит</div>${whoFor}</div>` : ''}
      ${steps ? `<div class="section"><div class="section-title">Как начать</div><div class="steps-list">${steps}</div></div>` : ''}
      ${docsNote}
      ${ctaBar}
    `;
  }

  fetch('/api/content/for-business')
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (d) render(d);
      else document.getElementById('content').innerHTML =
        '<div class="unavailable">Не удалось загрузить страницу.</div>';
    })
    .catch(() => {
      document.getElementById('content').innerHTML =
        '<div class="unavailable">Не удалось подключиться к серверу.</div>';
    });
</script>
</body>
</html>
