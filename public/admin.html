<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказы — оператор</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    .cfg { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .cfg input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    .order { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .order-meta { font-size: 13px; color: #666; margin-bottom: 6px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;
             background: #3390ec; color: #fff; font-size: 13px; }
    .error { color: #c0392b; margin: 8px 0; font-size: 14px; }
    .toggle { background: #eee; color: #555; white-space: nowrap; flex-shrink: 0; }
    .stats-mobile { display: none; }
    details.has-dirty > summary { color: #92400e; font-weight: 700; }
    details.has-dirty > summary::after { content: ' ●'; font-size: 10px; vertical-align: middle; }
    @media (max-width: 640px) {
      .stats-desktop { display: none !important; }
      .stats-mobile { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="cfg">
    <input id="apiBase" placeholder="http://127.0.0.1:8000">
    <div style="display:flex;flex:1;gap:4px;min-width:150px;">
      <input id="token" type="password" placeholder="Admin Token" style="min-width:0;">
      <button id="toggleBtn" class="toggle" onclick="toggleToken()">показать</button>
    </div>
    <button onclick="load()">Загрузить</button>
  </div>
  <div id="error" class="error"></div>
  <div id="jump-nav" style="display:none;margin:8px 0 16px;gap:8px;flex-wrap:wrap">
    <a href="#orders-section" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Заказы</a>
    <a href="#stock" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Наличие</a>
    <a href="#editor-details" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Редактор</a>
    <a href="#storefront-section" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Витрина</a>
    <a href="#stats-details" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Статистика</a>
  </div>
  <div id="orders-section" style="display:none;margin-bottom:24px">
    <div style="font-size:15px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Заказы и заявки</div>
    <div id="prepared-section" style="display:none;margin-bottom:16px;border:2px solid #f0a830;border-radius:8px;padding:12px 14px;background:#fffbf3">
      <div id="prepared-section-title" style="font-size:15px;font-weight:700;margin-bottom:8px">Заявки на готовый вид</div>
      <div id="prepared-orders"></div>
    </div>
    <div id="orders-active-section" style="display:none;margin-bottom:16px;border:2px solid #ddd;border-radius:8px;padding:12px 14px;background:#fafafa">
      <div id="orders-active-title" style="font-size:15px;font-weight:700;margin-bottom:8px">Обычные заказы</div>
      <div id="orders-active"></div>
    </div>
    <details id="prepared-closed-details" style="display:none;margin-bottom:8px">
      <summary style="cursor:pointer;font-size:14px;color:#888;padding:4px 0">Завершённые заявки</summary>
      <div id="prepared-orders-closed" style="margin-top:8px"></div>
    </details>
    <details id="orders-closed-details" style="display:none;margin-top:8px">
      <summary style="cursor:pointer;font-size:14px;color:#888;padding:4px 0">Завершённые заказы</summary>
      <div id="orders-closed" style="margin-top:8px"></div>
    </details>
  </div>
  <div id="stock"></div>
  <div id="stock-error" class="error"></div>
  <details id="editor-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Редактор товаров</summary>
    <div id="editor-error" class="error"></div>
    <div id="editor"></div>
  </details>
  <div id="storefront-section" style="display:none;margin-top:20px;border-top:2px solid #eee;padding-top:12px">
    <div style="font-size:15px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Витринный контент</div>
    <details id="wtb-details" style="margin:8px 0;display:none">
      <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Где купить</summary>
      <div id="wtb-error" class="error"></div>
      <div id="wtb-body"></div>
    </details>
    <details id="fb-details" style="margin:8px 0;display:none">
      <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Для бизнеса</summary>
      <div id="fb-error" class="error"></div>
      <div id="fb-body"></div>
    </details>
    <details id="por-details" style="margin:8px 0;display:none">
      <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Можно заказать в готовом виде</summary>
      <div id="por-error" class="error"></div>
      <div id="por-body"></div>
    </details>
  </div>
  <details id="stats-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Статистика</summary>
    <div id="stats-v2"></div>
  </details>

  <script>
    let refreshInterval = null;
    let lastKnownId = null;
    let audioCtx = null;
    let openCategories = new Set();
    let statsLoadedOnce = false;
    let wtbPoints = [];
    let wtbDirty = false;
    let fbDirty = false;
    let porDirty = false;
    let wtbServerJson = null;
    let fbServerJson  = null;
    let porServerJson = null;

    function beep() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e) {}
    }

    const LABELS = {
      NEW:       '🆕 Новый',
      ACCEPTED: '✅ Принят',
      REJECTED:  '❌ Отклонён',
      COOKING:   '🍳 Готовится',
      ONWAY:     '🚗 Выехал',
      DONE:      '✅ Доставлен',
    };

    const PREPARED_LABELS = {
      NEW:      '🆕 Новая',
      ACCEPTED: '✅ Принята',
      COOKING:  '🍳 Готовится',
      ONWAY:    '🚗 Выехал',
      DONE:     '✅ Доставлена',
      REJECTED: '❌ Отклонена',
    };

    function base() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
    function tok()  { return document.getElementById('token').value; }
    function showError(msg) { document.getElementById('error').textContent = msg; }

    function sanitizeToken(raw) {
      let s = raw.trim().replace(/[\u00A0\u200B-\u200D\uFEFF]/g, '');
      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i);
        if (code < 0x20 || code > 0x7E) {
          const hex = code.toString(16).toUpperCase().padStart(4, '0');
          return { value: null, error: `Токен содержит недопустимый символ "${s[i]}" (U+${hex}) на позиции ${i + 1}` };
        }
      }
      return { value: s, error: null };
    }

    function toggleToken() {
      const el = document.getElementById('token');
      const btn = document.getElementById('toggleBtn');
      if (el.type === 'password') { el.type = 'text'; btn.textContent = 'скрыть'; }
      else { el.type = 'password'; btn.textContent = 'показать'; }
    }
    function clearError()   { document.getElementById('error').textContent = ''; }
    function setDetailsDirty(id, dirty) { document.getElementById(id)?.classList.toggle('has-dirty', dirty); }
    function showStockError(msg) { document.getElementById('stock-error').textContent = msg; }
    function clearStockError()   { document.getElementById('stock-error').textContent = ''; }

    window.onload = () => {
      const saved = localStorage.getItem('apiBase');
      if (saved) document.getElementById('apiBase').value = saved;
      // token intentionally not restored
    };

    async function parseError(r) {
      if (r.status === 403) return 'Неверный токен. Проверьте Admin Token.';
      try {
        const j = await r.json();
        if (r.status >= 500) return `Ошибка сервера${j.detail ? ': ' + j.detail : '. Попробуйте позже.'}`;
        return j.detail || `Ошибка ${r.status}`;
      } catch {
        if (r.status >= 500) return 'Ошибка сервера. Попробуйте позже.';
        return `Ошибка ${r.status}`;
      }
    }

    async function load() {
      clearError();
      localStorage.setItem('apiBase', base());
      if (!audioCtx) { try { audioCtx = new AudioContext(); } catch(e) {} }
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showError(tokenError); return; }
      const r = await fetch(`${base()}/api/orders`, {
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) { clearInterval(refreshInterval); refreshInterval = null; return; }
      if (!r.ok) { showError(await parseError(r)); clearInterval(refreshInterval); refreshInterval = null; return; }
      const orders = await r.json();
      const newId = orders[0]?.id ?? null;
      if (lastKnownId !== null && newId !== null && newId !== lastKnownId) beep();
      lastKnownId = newId ?? lastKnownId;
      render(orders);
      fetch(`${base()}/api/catalog`, { cache: 'no-store' })
        .then(rc => rc.ok ? rc.json() : null)
        .then(catalog => {
          if (catalog) {
            clearStockError();
            renderStock(catalog.categories || []);
            renderEditor(catalog.categories || []);
            document.getElementById('editor-details').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/where-to-buy`)
        .then(r => r.ok ? r.json() : null)
        .then(wtb => {
          if (wtb) {
            renderWtb(wtb);
            document.getElementById('wtb-details').style.display = '';
            document.getElementById('storefront-section').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/for-business`)
        .then(r => r.ok ? r.json() : null)
        .then(fb => {
          if (fb) {
            renderFb(fb);
            document.getElementById('fb-details').style.display = '';
            document.getElementById('storefront-section').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/prepared-on-request`)
        .then(r => r.ok ? r.json() : null)
        .then(por => {
          if (por) {
            renderPor(por);
            document.getElementById('por-details').style.display = '';
            document.getElementById('storefront-section').style.display = '';
          }
        })
        .catch(() => {});
      if (!statsLoadedOnce) {
        document.getElementById('stats-details').style.display = 'none';
        document.getElementById('stats-v2').innerHTML = '';
      }
      fetch(`${base()}/api/admin/stats/v2`, { headers: { 'X-Admin-Token': token }, cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(stats => {
          if (stats) {
            renderStatsV2(stats);
            document.getElementById('stats-details').style.display = '';
            statsLoadedOnce = true;
          }
        })
        .catch(() => {});
      loadPrepared();
      clearInterval(refreshInterval);
      refreshInterval = setInterval(load, 15000);
    }

    function render(orders) {
      document.getElementById('orders-section').style.display = '';
      document.getElementById('jump-nav').style.display = 'flex';
      const CLOSED_STATUSES = new Set(['DONE', 'REJECTED']);
      const active = orders.filter(o => !CLOSED_STATUSES.has(o.status));
      const closed = orders.filter(o => CLOSED_STATUSES.has(o.status));
      function bonusInfo(o) {
        var BONUS_MIN = 1500, BONUS_PCT = 5;
        var base = o.total_before_bonus != null ? o.total_before_bonus : (o.total_rub || 0);
        var s = '<div style="font-size:12px;margin-top:6px;padding:6px 10px;background:#f0f4ff;border-radius:6px;line-height:1.6">';
        var e = '</div>';
        if (o.bonus_used) {
          var amount = o.bonus_spent || o.bonus_reserved || 0;
          var label;
          if (o.bonus_released_at) {
            label = '💳 Бонусы возвращены: ' + amount + ' бонусов (заказ отменён)';
          } else if (o.bonus_spent_at) {
            label = '💳 Бонусы списаны: ' + amount + ' бонусов';
          } else {
            label = '💳 Бонусы зарезервированы: ' + amount + ' бонусов';
          }
          return s + label + '<br><span style="opacity:.6">Новые бонусы за этот заказ не начисляются</span>' + e;
        }
        if (o.bonus_earned_at) {
          var earnLabel = o.bonus_card_created
            ? '🎁 Бонусная карта создана. Начислено: ' + o.bonus_earned + ' бонусов'
            : '🎁 Начислено: ' + o.bonus_earned + ' бонусов';
          return s + earnLabel + e;
        }
        if (base < BONUS_MIN) return '';
        if (o.status !== 'DONE' && o.status !== 'REJECTED') {
          var willEarn = Math.floor(base * BONUS_PCT / 100);
          return s + '🎁 Будет начислено при выполнении заказа: ' + willEarn + ' бонусов' + e;
        }
        if (o.bonus_card_id) {
          return s + '🎁 Бонусы ожидают начисления' + e;
        }
        return '';
      }
      window.adminIssuePin = async function adminIssuePin(orderId, phone) {
        var tk = sanitizeToken(tok());
        if (tk.error) { showError(tk.error); return; }
        var el = document.getElementById('pinresult-' + orderId);
        if (el) el.innerHTML = '<span style="opacity:.5">Запрашиваем...</span>';
        var r = await fetch(base() + '/api/admin/bonus-card/pin/issue?phone=' + encodeURIComponent(phone), {
          method: 'POST',
          headers: { 'X-Admin-Token': tk.value },
        }).catch(function() { return null; });
        if (!r) {
          if (el) el.innerHTML = '<span style="color:red">Ошибка сети</span>';
          return;
        }
        var data = await r.json().catch(function() { return null; });
        if (!r.ok) {
          if (el) el.innerHTML = '<span style="color:red">' + ((data && data.detail) || 'Ошибка') + '</span>';
          return;
        }
        if (data && data.pin_issued && data.pin) {
          if (el) el.innerHTML =
            '<b style="font-size:20px;letter-spacing:6px">' + data.pin + '</b>'
            + '<div style="font-size:11px;opacity:.6;margin-top:2px">Покажите код клиенту. Повторно этот же код не отображается.</div>';
        } else if (data && !data.pin_issued && data.already_set) {
          if (el) el.innerHTML = '<span style="opacity:.6">Код карты уже выдан</span>';
        }
      }
      function bonusPinBtn(o) {
        if (o.status !== 'DONE' || !o.bonus_card_id || o.bonus_used || !o.bonus_card_created) return '';
        if (o.bonus_pin_can_be_issued) {
          var safePhone = String(o.phone || '').replace(/'/g, "\\'");
          return '<div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
            + '<button onclick="adminIssuePin(\'' + o.id + '\',\'' + safePhone + '\')" '
            + 'style="padding:4px 12px;font-size:12px;background:#3390ec;color:#fff;border:none;border-radius:6px;cursor:pointer">'
            + 'Выдать код карты'
            + '</button>'
            + '<span id="pinresult-' + o.id + '"></span>'
            + '</div>';
        }
        return '<div style="font-size:12px;opacity:.6;margin-top:4px">Код карты уже выдан</div>';
      }
      const cardTpl = o => `
        <div class="order">
          <div class="order-meta">
            <b>#${o.id}</b> · <b>${LABELS[o.status] ?? o.status}</b> · ${o.total_rub}₽ · ${o.created_at ?? ''}
          </div>
          <div>${o.address ?? ''} · ${o.phone ?? ''}</div>
          ${o.comment ? `<div style="font-size:13px;opacity:.7">${o.comment}</div>` : ''}
          ${(o.items || []).length ? `<div style="font-size:13px;margin-top:4px">Состав:<br>${o.items.map(i =>
            `• ${i.name} — ${i.qty} ${i.unit || 'шт'} × ${Math.round(i.price_rub)}₽`
          ).join('<br>')}</div>` : ''}
          ${bonusInfo(o)}
          ${bonusPinBtn(o)}
          <div class="btns">
            ${Object.entries(LABELS).map(([s, l]) =>
              `<button onclick="setStatus('${o.id}','${s}')" style="${s === o.status ? 'outline:2px solid #f0a830;font-weight:700' : 'opacity:.55'}">${l}</button>`
            ).join('')}
          </div>
          <div style="margin-top:8px;display:flex;gap:6px;align-items:center">
            <input id="note-${o.id}" value="${esc(o.operator_note||'')}" placeholder="Заметка оператора"
              style="flex:1;padding:4px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px">
            <button id="notebtn-${o.id}" onclick="saveNote('${o.id}','note-${o.id}','notebtn-${o.id}')"
              style="padding:4px 10px;font-size:12px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;white-space:nowrap">
              Сохранить заметку
            </button>
          </div>
        </div>
      `;
      document.getElementById('orders-active').innerHTML = active.map(cardTpl).join('');
      const activeSection = document.getElementById('orders-active-section');
      const activeTitle = document.getElementById('orders-active-title');
      activeSection.style.display = active.length ? '' : 'none';
      if (activeTitle) activeTitle.textContent = active.length ? `Обычные заказы (${active.length})` : 'Обычные заказы';
      const closedEl = document.getElementById('orders-closed');
      const closedDetails = document.getElementById('orders-closed-details');
      closedEl.innerHTML = closed.map(cardTpl).join('');
      closedDetails.style.display = closed.length ? '' : 'none';
    }

    function fmtDate(iso) { const p = iso.split('-'); return `${p[2]}.${p[1]}.${p[0].slice(2)}`; }

    function renderStatsV2(s) {
      const stages = [
        ['menu_open',     '📋 Меню'],
        ['cart_add',      '➕ В корзину'],
        ['cart_open',     '🛒 Корзина'],
        ['order_created', '✅ Заказ'],
      ];
      const chLabels = { web: '🌐 Web', telegram: '💬 Telegram', total: '📊 Итого' };
      const channels = ['web', 'telegram', 'total'];

      function periodTable(period, label) {
        const headerCells = channels.map(ch => `<th colspan="2" style="text-align:center;padding:4px 8px">${chLabels[ch]}</th>`).join('');
        const subHeader = channels.map(() => `<th style="text-align:right;padding:2px 8px;font-weight:400;opacity:.6">Всего</th><th style="text-align:right;padding:2px 8px;font-weight:400;opacity:.6">Без повторов</th>`).join('');
        const rows = stages.map(([key, lbl]) => {
          const cells = channels.map(ch => {
            const d = period[ch]?.[key] || { raw: 0, unique: 0 };
            return `<td style="text-align:right;padding:3px 8px">${d.raw}</td><td style="text-align:right;padding:3px 8px;opacity:.7">${d.unique}</td>`;
          }).join('');
          return `<tr><td style="padding:3px 8px">${lbl}</td>${cells}</tr>`;
        }).join('');
        return `
          <div style="margin-bottom:12px">
            <b>${label}</b>
            <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:4px">
              <tr><th></th>${headerCells}</tr>
              <tr><th></th>${subHeader}</tr>
              ${rows}
            </table>
          </div>`;
      }

      function periodCards(period, label) {
        const cards = channels.map(ch => {
          const chData = period[ch] || {};
          const rows = stages.map(([key, lbl]) => {
            const d = chData[key] || { raw: 0, unique: 0 };
            return `<tr><td style="padding:2px 0">${lbl}</td><td style="text-align:right;padding:2px 6px">${d.raw}</td><td style="text-align:right;padding:2px 0">${d.unique}</td></tr>`;
          }).join('');
          return `<div style="border:1px solid #eee;border-radius:8px;padding:8px 12px;margin-bottom:6px">
            <div style="font-size:14px;font-weight:600;margin-bottom:4px">${chLabels[ch]}</div>
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <tr><th></th><th style="text-align:right;padding:0 6px;font-weight:400;opacity:.5;font-size:11px">Всего</th><th style="text-align:right;font-weight:400;opacity:.5;font-size:11px">Уник.</th></tr>
              ${rows}
            </table>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:12px"><b>${label}</b><div style="margin-top:4px">${cards}</div></div>`;
      }

      document.getElementById('stats-v2').innerHTML = `
        <div class="stats-desktop">
          ${periodTable(s.today, `Сегодня (${fmtDate(s.since_today)})`)}
          ${periodTable(s.month, `Месяц (с ${fmtDate(s.since_month)})`)}
        </div>
        <div class="stats-mobile">
          ${periodCards(s.today, `Сегодня (${fmtDate(s.since_today)})`)}
          ${periodCards(s.month, `Месяц (с ${fmtDate(s.since_month)})`)}
        </div>`;
    }

    function toggleCategory(catKey) {
      if (openCategories.has(catKey)) openCategories.delete(catKey);
      else openCategories.add(catKey);
      const items = document.getElementById('cat-items-' + catKey);
      const arrow = document.getElementById('cat-arrow-' + catKey);
      if (items) items.style.display = openCategories.has(catKey) ? 'block' : 'none';
      if (arrow) arrow.textContent = openCategories.has(catKey) ? '▲' : '▼';
    }

    function renderStock(categories) {
      const el = document.getElementById('stock');
      if (!categories.length) { el.innerHTML = ''; return; }
      const sections = categories.map((cat, idx) => {
        const catKey = String(cat.id ?? idx);
        const catLabel = cat.name ?? catKey;
        const items = cat.items || [];
        const unavailable = items.filter(i => i.in_stock === false).length;
        const isOpen = openCategories.has(catKey);
        const rows = items.map(item => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0">
            <span style="font-size:14px">${item.in_stock !== false ? '✅' : '❌'} ${item.name}</span>
            <button onclick="setStock('${catKey}','${item.id}',${item.in_stock !== false ? 'false' : 'true'})"
                    style="font-size:12px;padding:4px 10px">
              ${item.in_stock !== false ? 'Снять' : 'Вернуть'}
            </button>
          </div>`).join('');
        return `
          <div style="border:1px solid #eee;border-radius:6px;margin-bottom:6px">
            <div onclick="toggleCategory('${catKey}')" style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;user-select:none">
              <span style="font-size:14px;font-weight:600">${catLabel}${unavailable ? ` — ${unavailable} нет` : ''}</span>
              <span id="cat-arrow-${catKey}">${isOpen ? '▲' : '▼'}</span>
            </div>
            <div id="cat-items-${catKey}" style="display:${isOpen ? 'block' : 'none'};padding:0 12px">
              ${rows}
            </div>
          </div>`;
      }).join('');
      el.innerHTML = `<h3 style="margin:16px 0 8px;font-size:15px">Наличие товаров</h3>${sections}`;
    }

    async function setStock(catKey, itemId, inStock) {
      openCategories.add(catKey);
      clearStockError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showStockError(tokenError); return; }
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/stock?in_stock=${inStock}`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showStockError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) return;
      if (!r.ok) { showStockError(await parseError(r)); return; }
      load();
    }

    async function setStatus(id, status) {

      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showError(tokenError); return; }

    function renderPreparedOrders(requests) {
      const CLOSED_STATUSES = new Set(['DONE', 'REJECTED']);
      const active = requests.filter(r => !CLOSED_STATUSES.has(r.status));
      const closed = requests.filter(r => CLOSED_STATUSES.has(r.status));
      const title = document.getElementById('prepared-section-title');
      if (title) title.textContent = active.length
        ? `Заявки на готовый вид (${active.length})`
        : 'Заявки на готовый вид';
      const cardTpl = req => `
        <div class="order">
          <div class="order-meta">
            <b>#${req.id}</b> · <b>${PREPARED_LABELS[req.status] ?? req.status}</b> · ${req.created_at ?? ''}
          </div>
          <div>${esc(req.name)} · ${esc(req.phone)}</div>
          ${req.desired_time ? `<div style="font-size:13px;opacity:.7">К: ${esc(req.desired_time)}</div>` : ''}
          ${req.comment ? `<div style="font-size:13px;opacity:.7">${esc(req.comment)}</div>` : ''}
          ${(req.items || []).length ? `<div style="font-size:13px;margin-top:4px">Позиции:<br>${req.items.map(i =>
            `• ${esc(i.name)} — ${i.qty} шт.`
          ).join('<br>')}</div>` : ''}
          <div class="btns">
            ${Object.entries(PREPARED_LABELS).map(([s, l]) =>
              `<button onclick="setPreparedStatus('${req.id}','${s}')" style="${s === req.status ? 'outline:2px solid #f0a830;font-weight:700' : 'opacity:.55'}">${l}</button>`
            ).join('')}
          </div>
          <div style="margin-top:8px;display:flex;gap:6px;align-items:center">
            <input id="pnote-${req.id}" value="${esc(req.operator_note||'')}" placeholder="Заметка оператора"
              style="flex:1;padding:4px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px">
            <button id="pnotebtn-${req.id}" onclick="savePreparedNote('${req.id}','pnote-${req.id}','pnotebtn-${req.id}')"
              style="padding:4px 10px;font-size:12px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;white-space:nowrap">
              Сохранить заметку
            </button>
          </div>
        </div>
      `;
      document.getElementById('prepared-section').style.display = active.length ? '' : 'none';
      document.getElementById('prepared-orders').innerHTML = active.map(cardTpl).join('');
      const closedEl = document.getElementById('prepared-orders-closed');
      const closedDetails = document.getElementById('prepared-closed-details');
      closedEl.innerHTML = closed.map(cardTpl).join('');
      closedDetails.style.display = closed.length ? '' : 'none';
    }

    async function loadPrepared() {
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) return;

    // ── Редактор товаров ──────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let editorCatalog = [];
    let editorLoadedOnce = false;

    function showEditorError(msg) { document.getElementById('editor-error').textContent = msg; }
    function clearEditorError()   { document.getElementById('editor-error').textContent = ''; }

    function renderEditor(categories) {
      if (editorLoadedOnce) return;
      editorLoadedOnce = true;
      editorCatalog = categories;

        <div style="margin-bottom:16px">
          <div style="font-size:14px;font-weight:600;margin:10px 0 6px;opacity:.7">${cat.emoji || ''} ${cat.name}</div>
          ${(cat.items || []).map((item, idx) => renderItemRow(item, idx, cat)).join('')}
        </div>
      `).join('');
    }

    function renderItemRow(item, idx, cat) {

            </label>
            <label style="font-size:12px;opacity:.6">Заголовок
              <input id="et-${esc(item.id)}" value="${esc(item.title||'')}" placeholder="${esc(item.name)}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
            </label>
            <label style="font-size:12px;opacity:.6">Подзаголовок
              <input id="eu-${esc(item.id)}" value="${esc(item.subtitle||'')}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
            </label>
          </div>
          <div style="padding-top:8px;margin-top:4px;border-top:1px solid #f0f0f0;margin-bottom:6px">
            <div style="font-size:11px;font-weight:600;opacity:.45;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Для заказа в готовом виде</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <label style="font-size:12px;opacity:.5">Время приготовления
                <input id="epwt-${esc(item.id)}" value="${esc(item.prepared_wait_time||'')}" placeholder="напр. 30–40 минут" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #eee;border-radius:6px;font-size:13px;box-sizing:border-box">
              </label>
              <label style="font-size:12px;opacity:.5">Цена в готовом виде
                <input id="eppt-${esc(item.id)}" value="${esc(item.prepared_price_text||'')}" placeholder="напр. уточняется" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #eee;border-radius:6px;font-size:13px;box-sizing:border-box">
              </label>
              <label style="font-size:12px;opacity:.5">Примечание к позиции
                <input id="epn-${esc(item.id)}" value="${esc(item.prepared_note||'')}" placeholder="доп. условия" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #eee;border-radius:6px;font-size:13px;box-sizing:border-box">

    async function saveItem(itemId) {
      clearEditorError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      const price = parseInt(document.getElementById(`ep-${itemId}`)?.value, 10);
      let in_stock = true;
      for (const cat of editorCatalog) { const it = cat.items.find(i => i.id === itemId); if (it) { in_stock = it.in_stock !== false; break; } }
      const title             = document.getElementById(`et-${itemId}`)?.value ?? '';
      const subtitle          = document.getElementById(`eu-${itemId}`)?.value ?? '';
      const prepared_wait_time  = document.getElementById(`epwt-${itemId}`)?.value ?? '';
      const prepared_price_text = document.getElementById(`eppt-${itemId}`)?.value ?? '';
      const prepared_note       = document.getElementById(`epn-${itemId}`)?.value ?? '';
      const body = { in_stock };
      if (!isNaN(price)) body.price = price;
      body.title             = title;
      body.subtitle          = subtitle;
      body.prepared_wait_time  = prepared_wait_time;
      body.prepared_price_text = prepared_price_text;
      body.prepared_note       = prepared_note;
      const msgEl = document.getElementById(`emsg-${itemId}`);
      if (msgEl) { msgEl.textContent = '…'; msgEl.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}`, {
        method: 'PATCH',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(() => { showEditorError('Не удалось подключиться.'); return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }
      if (msgEl) { msgEl.textContent = '✓ Сохранено'; setTimeout(() => { msgEl.textContent = ''; }, 2000); }
    }

    async function uploadImage(itemId) {
      clearEditorError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      const fileInput = document.getElementById(`efile-${itemId}`);
      if (!fileInput?.files?.length) { showEditorError('Выберите файл'); return; }
      const msgEl = document.getElementById(`eimgmsg-${itemId}`);
      if (msgEl) msgEl.textContent = 'Загружается…';
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/image`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token },
        body: fd,
      }).catch(() => { showEditorError('Не удалось подключиться.'); if (msgEl) msgEl.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }
      const data = await r.json();
      if (msgEl) { msgEl.textContent = '✓ Фото обновлено'; setTimeout(() => { msgEl.textContent = ''; }, 3000); }
      const thumb = document.getElementById(`ethumb-${itemId}`);
      if (thumb && data.image) {
        thumb.src = `${base()}${data.image}?t=${Date.now()}`;
        thumb.style.display = '';
      }
      if (data.image && data.image.startsWith('/uploads/items/')) {
        const delBtn = document.getElementById(`edelete-${itemId}`);
        if (delBtn) delBtn.style.display = '';
      }
      for (const cat of editorCatalog) {
        for (const item of cat.items) {
          if (item.id === itemId) { item.image = data.image; break; }
        }
      }
      fileInput.value = '';
    }

    async function deleteImage(itemId) {
      if (!confirm('Удалить фото товара? Это действие нельзя отменить.')) return;
      clearEditorError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      const msgEl = document.getElementById(`eimgmsg-${itemId}`);
      if (msgEl) msgEl.textContent = 'Удаляется…';
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/image`, {
        method: 'DELETE',
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showEditorError('Не удалось подключиться.'); if (msgEl) msgEl.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }
      if (msgEl) { msgEl.textContent = '✓ Фото удалено'; setTimeout(() => { msgEl.textContent = ''; }, 3000); }
      const thumb = document.getElementById(`ethumb-${itemId}`);
      if (thumb) { thumb.src = ''; thumb.style.display = 'none'; }
      const delBtn = document.getElementById(`edelete-${itemId}`);
      if (delBtn) delBtn.style.display = 'none';
      for (const cat of editorCatalog) {
        for (const item of cat.items) {
          if (item.id === itemId) { delete item.image; break; }
        }
      }
    }

    async function moveItem(catId, itemId, dir) {
      const cat = editorCatalog.find(c => c.id === catId);
      if (!cat) return;
      const items = [...cat.items];
      const idx = items.findIndex(i => i.id === itemId);
      if (idx < 0) return;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= items.length) return;
      [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
      cat.items = items;
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      clearEditorError();
      const r = await fetch(`${base()}/api/admin/catalog/categories/${catId}/reorder`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_ids: items.map(i => i.id) }),
      }).catch(() => { showEditorError('Не удалось подключиться.'); return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); return; }
      renderEditor(editorCatalog);
      const msgEl = document.getElementById(`emsg-${itemId}`);
      if (msgEl) { msgEl.textContent = '✓ Порядок обновлён'; setTimeout(() => { if (msgEl.textContent === '✓ Порядок обновлён') msgEl.textContent = ''; }, 2000); }
    }

        else { m.textContent = ''; m.style.cssText = 'font-size:12px;opacity:.6'; }
      }
      const base = JSON.parse(porServerJson);
      [
        ['por-visible','visible'],['por-title','title'],['por-subtitle','subtitle'],
        ['por-disclaimer','disclaimer'],['por-cta-text','cta_text'],
        ['por-sec-text','cta_secondary_text'],['por-sec-mode','cta_secondary_mode'],['por-sec-value','cta_secondary_value'],
      ].forEach(([id, key]) => {
        const el = document.getElementById(id);
        if (el) highlightField(id, String(el.type === 'checkbox' ? el.checked : el.value) !== String(base[key]));
      });

    function highlightField(id, isDirty) {
      const el = document.getElementById(id);
      if (!el) return;
      el.style.outline = isDirty ? '2px solid #f0a830' : '';

        el.style.background = isDirty ? '#fffbf3' : '';

        const isNew     = i >= basePoints.length;
        const isChanged = !isNew && JSON.stringify(basePoints[i]) !== JSON.stringify(wtbPoints[i]);

        badge.textContent      = isNew ? 'новая' : isChanged ? 'не сохранено' : '';

    async function reloadItem(itemId) {
      clearEditorError();
      const r = await fetch(`${base()}/api/catalog`)
        .catch(() => { showEditorError('Не удалось подключиться.'); return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); return; }
      const data = await r.json();
      let found = false;
      for (const cat of (data.categories || [])) {
        const idx = cat.items.findIndex(i => i.id === itemId);
        if (idx >= 0) {
          found = true;
          const item = cat.items[idx];
          for (const ec of editorCatalog) {
            const ei = ec.items.findIndex(i => i.id === itemId);
            if (ei >= 0) { ec.items[ei] = item; break; }
          }
          const row = document.getElementById(`erow-${itemId}`);
          if (row) row.outerHTML = renderItemRow(item, idx, cat);
          break;
        }
      }
      if (!found) showEditorError('Не удалось перезагрузить товар с сервера.');
    }

              <select id="por-sec-mode" style="padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
                <option value="phone" ${data.cta_secondary_mode==='phone'?'selected':''}>phone</option>
                <option value="link" ${data.cta_secondary_mode==='link'?'selected':''}>link</option>
              </select>
            </label>
            <label style="font-size:12px;opacity:.6">Значение (тел. или URL)<br>
              <input id="por-sec-value" value="${esc(data.cta_secondary_value||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
            </label>
          </div>
        </div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <button onclick="savePor()" style="padding:6px 16px;border:none;border-radius:6px;background:#3390ec;color:#fff;font-size:13px;cursor:pointer">Сохранить</button>
          <button onclick="reloadPor()" style="padding:6px 14px;border:none;border-radius:6px;background:#eee;color:#333;font-size:13px;cursor:pointer">Сбросить изменения</button>
          <span id="por-msg" style="font-size:12px;opacity:.6"></span>
        </div>
      `;
      body.oninput = body.onchange = () => { checkPorDirty(); };
    }

    async function savePor() {
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { document.getElementById('por-error').textContent = tokenError; return; }
      document.getElementById('por-error').textContent = '';
      const payload = {
        visible:             document.getElementById('por-visible')?.checked ?? false,
        title:               document.getElementById('por-title')?.value ?? '',
        subtitle:            document.getElementById('por-subtitle')?.value ?? '',
        disclaimer:          document.getElementById('por-disclaimer')?.value ?? '',
        cta_text:            document.getElementById('por-cta-text')?.value ?? '',
        cta_secondary_text:  document.getElementById('por-sec-text')?.value ?? '',
        cta_secondary_mode:  document.getElementById('por-sec-mode')?.value ?? 'phone',
        cta_secondary_value: document.getElementById('por-sec-value')?.value ?? '',
      };
      const msg = document.getElementById('por-msg');
      if (msg) { msg.textContent = '…'; msg.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      const r = await fetch(`${base()}/api/admin/content/prepared-on-request`, {
        method: 'PUT',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }).catch(() => { document.getElementById('por-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('por-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      porServerJson = currentPorJson();
      checkPorDirty();
      if (msg) { msg.textContent = '✓ Сохранено'; setTimeout(() => { msg.textContent = ''; }, 2000); }
    }

    async function reloadPor() {
      const msg = document.getElementById('por-msg');
      if (msg) msg.textContent = '…';
      const r = await fetch(`${base()}/api/content/prepared-on-request`)
        .catch(() => { document.getElementById('por-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('por-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      const data = await r.json();
      porDirty = false; setDetailsDirty('por-details', false);
      if (msg) { msg.textContent = ''; msg.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      renderPor(data);
    }

    async function reloadWtb() {
      const msg = document.getElementById('wtb-msg');
      if (msg) msg.textContent = '…';
      const r = await fetch(`${base()}/api/content/where-to-buy`)
        .catch(() => { document.getElementById('wtb-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('wtb-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      const data = await r.json();
      wtbDirty = false; setDetailsDirty('wtb-details', false);
      if (msg) { msg.textContent = ''; msg.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      renderWtb(data);
    }

    async function reloadFb() {
      const msg = document.getElementById('fb-msg');
      if (msg) msg.textContent = '…';
      const r = await fetch(`${base()}/api/content/for-business`)
        .catch(() => { document.getElementById('fb-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('fb-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      const data = await r.json();
      fbDirty = false; setDetailsDirty('fb-details', false);
      if (msg) { msg.textContent = ''; msg.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      renderFb(data);
    }
    window.addEventListener('scroll', function() {
      document.getElementById('back-to-top').style.display =
        window.scrollY > 300 ? 'block' : 'none';
    });
  </script>
  <button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})"
    aria-label="Наверх" title="Наверх"
    style="display:none;position:fixed;bottom:20px;right:20px;z-index:999;
           background:#3390ec;color:#fff;border:none;border-radius:50%;width:44px;height:44px;
           font-size:20px;line-height:1;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.25)">↑</button>
</body>
</html>
