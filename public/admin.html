<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказы — оператор</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    .cfg { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .cfg input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    .order { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .order-meta { font-size: 13px; color: #666; margin-bottom: 6px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;
             background: #3390ec; color: #fff; font-size: 13px; }
    .error { color: #c0392b; margin: 8px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="cfg">
    <input id="apiBase" placeholder="http://127.0.0.1:8000">
    <input id="token" type="password" placeholder="Admin Token">
    <button onclick="load()">Загрузить</button>
  </div>
  <div id="error" class="error"></div>
  <div id="orders"></div>

  <script>
    const LABELS = {
      ACCEPTED: '✅ Принят',
      REJECTED:  '❌ Отклонён',
      COOKING:   '🍳 Готовится',
      ONWAY:     '🚗 Выехал',
      DONE:      '✅ Доставлен',
    };

    function base() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
    function tok()  { return document.getElementById('token').value; }
    function showError(msg) { document.getElementById('error').textContent = msg; }
    function clearError()   { document.getElementById('error').textContent = ''; }

    window.onload = () => {
      const saved = localStorage.getItem('apiBase');
      if (saved) document.getElementById('apiBase').value = saved;
      // token intentionally not restored
    };

    async function parseError(r) {
      try {
        const j = await r.json();
        return `Ошибка ${r.status}${j.detail ? ': ' + j.detail : ''}`;
      } catch {
        return `Ошибка ${r.status}`;
      }
    }

    async function load() {
      clearError();
      localStorage.setItem('apiBase', base());
      const r = await fetch(`${base()}/api/orders`, {
        headers: { 'X-Admin-Token': tok() },
      }).catch(e => { showError(`Сеть: ${e.message}`); return null; });
      if (!r) return;
      if (!r.ok) { showError(await parseError(r)); return; }
      render(await r.json());
    }

    function render(orders) {
      document.getElementById('orders').innerHTML = orders.map(o => `
        <div class="order">
          <div class="order-meta">
            <b>#${o.id}</b> · <b>${o.status}</b> · ${o.total_rub}₽ · ${o.created_at ?? ''}
          </div>
          <div>${o.address ?? ''} · ${o.phone ?? ''}</div>
          ${o.comment ? `<div style="font-size:13px;opacity:.7">${o.comment}</div>` : ''}
          <div class="btns">
            ${Object.entries(LABELS).map(([s, l]) =>
              `<button onclick="setStatus('${o.id}','${s}')">${l}</button>`
            ).join('')}
          </div>
        </div>
      `).join('') || '<div style="opacity:.5">Заказов нет</div>';
    }

    async function setStatus(id, status) {
      clearError();
      const r = await fetch(`${base()}/api/orders/${id}/status?status=${status}`, {
        method: 'POST',
        headers: { 'X-Admin-Token': tok() },
      }).catch(e => { showError(`Сеть: ${e.message}`); return null; });
      if (!r) return;
      if (!r.ok) { showError(await parseError(r)); return; }
      load(); // reload only on success
    }
  </script>
</body>
</html>
