<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказы — оператор</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    .cfg { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .cfg input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    .order { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .order-meta { font-size: 13px; color: #666; margin-bottom: 6px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;
             background: #3390ec; color: #fff; font-size: 13px; }
    .error { color: #c0392b; margin: 8px 0; font-size: 14px; }
    .toggle { background: #eee; color: #555; white-space: nowrap; flex-shrink: 0; }
    .stats-mobile { display: none; }
    details.has-dirty > summary { color: #92400e; font-weight: 700; }
    details.has-dirty > summary::after { content: ' ●'; font-size: 10px; vertical-align: middle; }
    @media (max-width: 640px) {
      .stats-desktop { display: none !important; }
      .stats-mobile { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="cfg">
    <input id="apiBase" placeholder="http://127.0.0.1:8000">
    <div style="display:flex;flex:1;gap:4px;min-width:150px;">
      <input id="token" type="password" placeholder="Admin Token" style="min-width:0;">
      <button id="toggleBtn" class="toggle" onclick="toggleToken()">показать</button>
    </div>
    <button onclick="load()">Загрузить</button>
  </div>
  <div id="error" class="error"></div>
  <div id="jump-nav" style="display:none;margin:8px 0 16px;gap:8px;flex-wrap:wrap">
    <a href="#orders-section" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Заказы</a>
    <a href="#stock" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Наличие</a>
    <a href="#editor-details" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Редактор</a>
    <a href="#storefront-section" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Витрина</a>
    <a href="#stats-details" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Статистика</a>
    <a href="#bonus-cards-details" style="font-size:12px;padding:4px 10px;background:#eee;border-radius:6px;text-decoration:none;color:#333">Бонусные карты</a>
  </div>
  <div id="orders-section" style="display:none;margin-bottom:24px">
    <div style="font-size:15px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Заказы</div>
    <div id="orders-active-section" style="display:none;margin-bottom:16px;border:2px solid #3390ec;border-radius:8px;padding:12px 14px;background:#f5faff">
      <div id="orders-active-title" style="font-size:15px;font-weight:700;margin-bottom:8px">Активные заказы</div>
      <div id="orders-active"></div>
    </div>
    <details id="orders-closed-details" style="display:none;margin-bottom:8px">
      <summary style="cursor:pointer;font-size:14px;color:#888;padding:4px 0">Завершённые заказы</summary>
      <div id="orders-closed" style="margin-top:8px"></div>
    </details>
  </div>
  <div id="stock"></div>
  <div id="stock-error" class="error"></div>
  <details id="editor-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Редактор товаров</summary>
    <div id="editor-error" class="error"></div>
    <div id="editor"></div>
  </details>
  <div id="storefront-section" style="display:none;margin-top:20px;border-top:2px solid #eee;padding-top:12px">
    <div style="font-size:15px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Витринный контент</div>
    <details id="about-details" style="margin:8px 0;display:none">
      <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">О нас</summary>
      <div id="about-error" class="error"></div>
      <div id="about-body"></div>
    </details>
    <details id="wtb-details" style="margin:8px 0;display:none">
      <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Где купить</summary>
      <div id="wtb-error" class="error"></div>
      <div id="wtb-body"></div>
    </details>
    <details id="fb-details" style="margin:8px 0;display:none">
      <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Для бизнеса</summary>
      <div id="fb-error" class="error"></div>
      <div id="fb-body"></div>
    </details>
    <details id="promo-details" style="margin:8px 0;display:none">
      <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Специальные предложения</summary>
      <div id="promo-error" class="error"></div>
      <div id="promo-body"></div>
    </details>
  </div>
  <details id="stats-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Статистика</summary>
    <div id="stats-v2"></div>
  </details>
  <details id="bonus-cards-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Бонусные карты</summary>
    <div style="margin-top:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center">
        <input id="bonus-search-phone" placeholder="+7..." style="flex:1;min-width:140px;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px">
        <button onclick="loadBonusCards(document.getElementById('bonus-search-phone').value)">Найти</button>
        <button onclick="document.getElementById('bonus-search-phone').value='';loadBonusCards()" style="background:#eee;color:#333">Все</button>
      </div>
      <div id="bonus-cards-list"></div>
    </div>
  </details>

  <script>
    let refreshInterval = null;
    let lastKnownId = null;
    let audioCtx = null;
    let openCategories = new Set();
    let statsLoadedOnce = false;
    let wtbPoints = [];
    let wtbDirty = false;
    let fbDirty = false;
    let aboutDirty = false;
    let promoDirty = false;
    let wtbServerJson = null;
    let fbServerJson  = null;
    let aboutServerJson = null;
    let promoServerJson = null;
    let promoItems = [];
    let errorTimestamp = 0;

    function beep() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e) {}
    }

    const LABELS = {
      NEW:       '🆕 Новый',
      ACCEPTED: '✅ Принят',
      REJECTED:  '❌ Отклонён',
      COOKING:   '🍳 В работе',
      ONWAY:     '🚗 Выехал',
      DONE:      '✅ Доставлен',
    };


    function base() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
    function tok()  { return document.getElementById('token').value; }
    function showError(msg) { document.getElementById('error').textContent = msg; errorTimestamp = Date.now(); }

    function sanitizeToken(raw) {
      let s = raw.trim().replace(/[\u00A0\u200B-\u200D\uFEFF]/g, '');
      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i);
        if (code < 0x20 || code > 0x7E) {
          const hex = code.toString(16).toUpperCase().padStart(4, '0');
          return { value: null, error: `Токен содержит недопустимый символ "${s[i]}" (U+${hex}) на позиции ${i + 1}` };
        }
      }
      return { value: s, error: null };
    }

    function toggleToken() {
      const el = document.getElementById('token');
      const btn = document.getElementById('toggleBtn');
      if (el.type === 'password') { el.type = 'text'; btn.textContent = 'скрыть'; }
      else { el.type = 'password'; btn.textContent = 'показать'; }
    }
    function clearError(force) {
      if (!force && Date.now() - errorTimestamp < 60000) return;
      document.getElementById('error').textContent = '';
      errorTimestamp = 0;
    }
    function orderModeBadge(mode) {
      const labels = {'hot':'🔥 Горячее','frozen':'❄️ Заморозка','mixed':'🔥 + ❄️ Смешанный'};
      const bg     = {'hot':'#fff0ed','frozen':'#e8f0fb','mixed':'#f5f0ff'};
      const color  = {'hot':'#b94a00','frozen':'#2d5fa8','mixed':'#6b3fa0'};
      if (!mode || !labels[mode]) return '';
      return `<span style="display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;vertical-align:middle;background:${bg[mode]};color:${color[mode]}">${labels[mode]}</span>`;
    }
    function setDetailsDirty(id, dirty) { document.getElementById(id)?.classList.toggle('has-dirty', dirty); }
    function showStockError(msg) { document.getElementById('stock-error').textContent = msg; }
    function clearStockError()   { document.getElementById('stock-error').textContent = ''; }

    window.onload = () => {
      const saved = localStorage.getItem('apiBase');
      if (saved) document.getElementById('apiBase').value = saved;
      // token intentionally not restored
    };

    async function parseError(r) {
      if (r.status === 403) return 'Неверный токен. Проверьте Admin Token.';
      try {
        const j = await r.json();
        if (r.status >= 500) return `Ошибка сервера${j.detail ? ': ' + j.detail : '. Попробуйте позже.'}`;
        return j.detail || `Ошибка ${r.status}`;
      } catch {
        if (r.status >= 500) return 'Ошибка сервера. Попробуйте позже.';
        return `Ошибка ${r.status}`;
      }
    }

    async function load() {
      clearError();
      localStorage.setItem('apiBase', base());
      if (!audioCtx) { try { audioCtx = new AudioContext(); } catch(e) {} }
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showError(tokenError); return; }
      const r = await fetch(`${base()}/api/orders`, {
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) { clearInterval(refreshInterval); refreshInterval = null; return; }
      if (!r.ok) { showError(await parseError(r)); clearInterval(refreshInterval); refreshInterval = null; return; }
      const orders = await r.json();
      const newOrder = orders[0] ?? null;
      const newId = newOrder?.id ?? null;
      if (lastKnownId !== null && newId !== null && newId !== lastKnownId && !Boolean(newOrder?.is_test)) beep();
      lastKnownId = newId ?? lastKnownId;
      render(orders);
      fetch(`${base()}/api/catalog`, { cache: 'no-store' })
        .then(rc => rc.ok ? rc.json() : null)
        .then(catalog => {
          if (catalog) {
            clearStockError();
            renderStock(catalog.categories || []);
            renderEditor(catalog.categories || [], catalog.hot_categories || []);
            document.getElementById('editor-details').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/where-to-buy`)
        .then(r => r.ok ? r.json() : null)
        .then(wtb => {
          if (wtb) {
            renderWtb(wtb);
            document.getElementById('wtb-details').style.display = '';
            document.getElementById('storefront-section').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/for-business`)
        .then(r => r.ok ? r.json() : null)
        .then(fb => {
          if (fb) {
            renderFb(fb);
            document.getElementById('fb-details').style.display = '';
            document.getElementById('storefront-section').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/promotions`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data) {
            renderPromos(data);
            document.getElementById('promo-details').style.display = '';
            document.getElementById('storefront-section').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/about`)
        .then(r => r.ok ? r.json() : null)
        .then(about => {
          if (about) {
            renderAbout(about);
            document.getElementById('about-details').style.display = '';
            document.getElementById('storefront-section').style.display = '';
          }
        })
        .catch(() => {});
      if (!statsLoadedOnce) {
        document.getElementById('stats-details').style.display = 'none';
        document.getElementById('stats-v2').innerHTML = '';
      }
      fetch(`${base()}/api/admin/stats/v2`, { headers: { 'X-Admin-Token': token }, cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(stats => {
          if (stats) {
            renderStatsV2(stats);
            document.getElementById('stats-details').style.display = '';
            statsLoadedOnce = true;
          }
        })
        .catch(() => {});
      document.getElementById('bonus-cards-details').style.display = '';
      if (document.getElementById('bonus-cards-details').open
          && !document.getElementById('bonus-cards-list').children.length) {
        loadBonusCards(document.getElementById('bonus-search-phone').value || undefined);
      }
      clearInterval(refreshInterval);
      refreshInterval = setInterval(load, 15000);
    }

    function render(orders) {
      document.getElementById('orders-section').style.display = '';
      document.getElementById('jump-nav').style.display = 'flex';
      const CLOSED_STATUSES = new Set(['DONE', 'REJECTED']);
      const active = orders
        .map((o, i) => ({ o, i }))
        .filter(({ o }) => !CLOSED_STATUSES.has(o.status))
        .sort((a, b) => {
          const pri = o => (o.order_mode === 'hot' || o.order_mode === 'mixed') ? 0 : 1;
          return pri(a.o) - pri(b.o) || a.i - b.i;
        })
        .map(({ o }) => o);
      const closed = orders.filter(o => CLOSED_STATUSES.has(o.status));
      const cardTpl = o => `
        <div class="order">
          <div class="order-meta">
            <b>#${o.id}</b> · <b>${LABELS[o.status] ?? o.status}</b> · ${o.total_rub}₽ · ${o.created_at ?? ''}${o.order_mode ? ' · ' + orderModeBadge(o.order_mode) : ''}${Boolean(o.is_test) ? ' · <span style="background:#ff3b30;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:0.5px;vertical-align:middle">ТЕСТ</span>' : ''}
          </div>
          <div>${o.address ?? ''} · ${o.phone ?? ''}</div>
          ${o.comment ? `<div style="font-size:13px;opacity:.7">${o.comment}</div>` : ''}
          ${(o.items || []).length ? `<div style="font-size:13px;margin-top:4px">Состав:<br>${o.items.map(i => { const mp = o.order_mode === 'mixed' && i.item_order_mode ? (i.item_order_mode === 'hot' ? '🔥 · ' : '❄️ · ') : ''; return `• ${mp}${i.name} — ${i.qty} ${i.unit || 'шт'} × ${Math.round(i.price_rub)}₽`; }).join('<br>')}</div>` : ''}
          <div class="btns">
            ${Object.entries(LABELS).map(([s, l]) =>
              `<button onclick="setStatus('${o.id}','${s}')" style="${s === o.status ? 'outline:2px solid #f0a830;font-weight:700' : 'opacity:.55'}">${l}</button>`
            ).join('')}
          </div>
          ${bonusInfo(o)}
          ${bonusPinBtn(o)}
          <div style="margin-top:8px;display:flex;gap:6px;align-items:center">
            <input id="note-${o.id}" value="${esc(o.operator_note||'')}" placeholder="Заметка оператора"
              style="flex:1;padding:4px 8px;border:1px solid #ddd;border-radius:6px;font-size:12px">
            <button id="notebtn-${o.id}" onclick="saveNote('${o.id}','note-${o.id}','notebtn-${o.id}')"
              style="padding:4px 10px;font-size:12px;background:#eee;color:#333;border:none;border-radius:6px;cursor:pointer;white-space:nowrap">
              Сохранить заметку
            </button>
          </div>
        </div>
      `;
      document.getElementById('orders-active').innerHTML = active.map(cardTpl).join('');
      const activeSection = document.getElementById('orders-active-section');
      const activeTitle = document.getElementById('orders-active-title');
      activeSection.style.display = active.length ? '' : 'none';
      if (activeTitle) activeTitle.textContent = active.length ? `Активные заказы (${active.length})` : 'Активные заказы';
      const closedEl = document.getElementById('orders-closed');
      const closedDetails = document.getElementById('orders-closed-details');
      closedEl.innerHTML = closed.map(cardTpl).join('');
      closedDetails.style.display = closed.length ? '' : 'none';
    }

    function fmtDate(iso) { const p = iso.split('-'); return `${p[2]}.${p[1]}.${p[0].slice(2)}`; }

    // ── Бонусные вспомогательные функции ────────────────────────────────
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function issuedPinHtml(pin) {
      return '<div style="margin-top:6px;padding:6px 10px;background:#e8f5e9;border-radius:6px;font-size:13px">'
        + '💳 Код карты клиента: <b style="font-size:18px;letter-spacing:5px">' + pin + '</b>'
        + '<div style="font-size:11px;opacity:.6;margin-top:2px">После перезагрузки страницы код повторно не показывается.</div>'
        + '</div>';
    }

    function bonusInfo(o) {
      var BONUS_MIN = 1500, BONUS_PCT = 5;
      var base = o.total_before_bonus != null ? o.total_before_bonus : (o.total_rub || 0);
      var s = '<div style="font-size:12px;margin-top:6px;padding:6px 10px;background:#f0f4ff;border-radius:6px;line-height:1.6">';
      var e = '</div>';
      if (o.bonus_used) {
        var amount = o.bonus_spent || o.bonus_reserved || 0;
        var statusLine;
        if (o.bonus_released_at) {
          statusLine = '💳 Бонусы возвращены: ' + amount + ' бонусов (заказ отменён)';
        } else if (o.bonus_spent_at) {
          statusLine = '💳 Списано: ' + amount + ' бонусов';
        } else {
          statusLine = '💳 Клиент хочет списать: ' + amount + ' бонусов (зарезервировано)';
        }
        var breakdown = (o.total_before_bonus != null && o.total_rub != null && amount > 0)
          ? '<br><span style="opacity:.7">Сумма до списания: ' + o.total_before_bonus + ' ₽ · Скидка: −' + amount + ' ₽ · К оплате: ' + o.total_rub + ' ₽</span>'
          : '';
        return s + statusLine + breakdown + '<br><span style="opacity:.6">Новые бонусы за этот заказ не начисляются</span>' + e;
      }
      if (o.bonus_earn_reversed_at) {
        var reversedLabel = o.bonus_card_created
          ? '🎁 Начисление отменено. Бонусная карта, созданная этим заказом, аннулирована.'
          : '🎁 Начисление отменено: ' + (o.bonus_earned || 0) + ' бонусов';
        return s + reversedLabel + e;
      }
      if (o.bonus_earned_at) {
        var earnLabel = o.bonus_card_created
          ? '🎁 Бонусная карта создана. Начислено: ' + o.bonus_earned + ' бонусов'
          : '🎁 Начислено: ' + o.bonus_earned + ' бонусов';
        return s + earnLabel + e;
      }
      if (base < BONUS_MIN && !o.bonus_customer_has_card) return '';
      if (o.status !== 'DONE' && o.status !== 'REJECTED') {
        var willEarn = Math.floor(base * BONUS_PCT / 100);
        if (willEarn <= 0) return '';
        var msg = o.bonus_customer_has_card
          ? '🎁 Будет начислено при выполнении заказа: ' + willEarn + ' бонусов'
          : '🎁 При доставке будет создана бонусная карта и начислено: ' + willEarn + ' бонусов';
        return s + msg + e;
      }
      if (o.bonus_card_id) {
        return s + '🎁 Бонусы ожидают начисления' + e;
      }
      return '';
    }

    function bonusPinBtn(o) {
      if (window.adminIssuedPins && window.adminIssuedPins[o.id]) {
        return issuedPinHtml(window.adminIssuedPins[o.id]);
      }
      if (o.status !== 'DONE' || !o.bonus_card_id || o.bonus_used || !o.bonus_card_created) return '';
      if (o.bonus_pin_can_be_issued) {
        var safePhone = String(o.phone || '').replace(/'/g, "\\'");
        return '<div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
          + '<button onclick="adminIssuePin(\'' + o.id + '\',\'' + safePhone + '\')" '
          + 'style="padding:4px 12px;font-size:12px;background:#3390ec;color:#fff;border:none;border-radius:6px;cursor:pointer">'
          + 'Выдать код карты'
          + '</button>'
          + '<span id="pinresult-' + o.id + '"></span>'
          + '</div>';
      }
      return '<div style="font-size:12px;opacity:.6;margin-top:4px">Код карты уже выдан</div>';
    }

    window.adminIssuePin = async function adminIssuePin(orderId, phone) {
      var tk = sanitizeToken(tok());
      if (tk.error) { showError(tk.error); return; }
      var el = document.getElementById('pinresult-' + orderId);
      if (el) el.innerHTML = '<span style="opacity:.5">Запрашиваем...</span>';
      var r = await fetch(base() + '/api/admin/bonus-card/pin/issue?phone=' + encodeURIComponent(phone), {
        method: 'POST',
        headers: { 'X-Admin-Token': tk.value },
      }).catch(function() { return null; });
      if (!r) {
        if (el) el.innerHTML = '<span style="color:red">Ошибка сети</span>';
        return;
      }
      var data = await r.json().catch(function() { return null; });
      if (!r.ok) {
        if (el) el.innerHTML = '<span style="color:red">' + ((data && data.detail) || 'Ошибка') + '</span>';
        return;
      }
      if (data && data.pin_issued && data.pin) {
        window.adminIssuedPins = window.adminIssuedPins || {};
        window.adminIssuedPins[orderId] = data.pin;
        if (el && el.parentElement) el.parentElement.outerHTML = issuedPinHtml(data.pin);
        else if (el) el.innerHTML = issuedPinHtml(data.pin);
      } else if (data && !data.pin_issued && data.already_set) {
        if (el) el.innerHTML = '<span style="opacity:.6">Код карты уже выдан</span>';
      }
    };

    async function loadBonusCards(phone) {
      var tk = sanitizeToken(tok());
      if (tk.error) { showError(tk.error); return; }
      var el = document.getElementById('bonus-cards-list');
      el.innerHTML = '<span style="opacity:.5">Загрузка...</span>';
      var params = new URLSearchParams({ limit: '50' });
      if (phone && phone.trim()) params.set('phone', phone.trim());
      var r = await fetch(base() + '/api/admin/bonus-cards?' + params.toString(), {
        headers: { 'X-Admin-Token': tk.value },
      }).catch(function() { return null; });
      if (!r || !r.ok) { el.innerHTML = '<span style="color:red">Ошибка загрузки</span>'; return; }
      var cards = await r.json().catch(function() { return []; });
      if (!cards.length) { el.innerHTML = '<span style="opacity:.6">Карт не найдено</span>'; return; }
      el.innerHTML = cards.map(bonusCardRow).join('');
    }

    function bonusCardRow(c) {

      var resetBtn = '<button onclick="adminResetPin(' + c.id + ',\'' + safePhone + '\')" '

        + resetLabel + '</button>';

        + 'style="' + btnStyle + ';background:#1565c0">'
        + 'Корректировать</button>';

      if (window.adminResetPins && window.adminResetPins[c.id]) {
        resetPinBlock = issuedPinHtml(window.adminResetPins[c.id]);

      var txCached = window.adminTxCache && window.adminTxCache[c.id];

        + 'Доступно: <b>' + avail + '</b> · '
        + 'Баланс: ' + (c.balance || 0) + ' · '

    window.adminResetPin = async function adminResetPin(cardId, phone) {
      if (!confirm('Сбросить PIN этой карты и показать новый код?\nСтарый код перестанет работать.')) return;
      var tk = sanitizeToken(tok());
      if (tk.error) { showError(tk.error); return; }
      var params = new URLSearchParams({ phone: phone });
      var r = await fetch(base() + '/api/admin/bonus-card/pin/reset?' + params.toString(), {
        method: 'POST', headers: { 'X-Admin-Token': tk.value },
      }).catch(function() { return null; });
      if (!r) { showError('Ошибка сети'); return; }
      var data = await r.json().catch(function() { return null; });
      if (!r.ok) { showError((data && data.detail) || 'Ошибка'); return; }
      if (data && data.pin) {
        window.adminResetPins = window.adminResetPins || {};
        window.adminResetPins[cardId] = data.pin;
        loadBonusCards(document.getElementById('bonus-search-phone').value || undefined);
      }
    };

    window.adminAdjustBalance = async function adminAdjustBalance(cardId, phone) {
      var delta;
      while (true) {
        var deltaStr = prompt('Введите изменение баланса:\nнапример 100 или -100');
        if (deltaStr === null) return;
        var raw = deltaStr.trim();
        if (!/^-?\d+$/.test(raw)) { alert('Введите целое число, например 100 или -100.'); continue; }
        var n = Number(raw);
        if (!Number.isSafeInteger(n) || n === 0) { alert('Введите ненулевое целое число.'); continue; }
        delta = n;
        break;
      }
      var comment;
      while (true) {
        var c = prompt('Комментарий / причина корректировки');
        if (c === null) return;
        if (!c.trim()) { alert('Комментарий не может быть пустым.'); continue; }
        comment = c;
        break;
      }
      var sign = delta > 0 ? '+' : '';
      if (!confirm('Применить корректировку ' + sign + delta + ' бонусов для карты ' + phone + '?')) return;
      var tk = sanitizeToken(tok());
      if (tk.error) { showError(tk.error); return; }
      var r = await fetch(base() + '/api/admin/bonus-cards/' + cardId + '/adjust', {
        method: 'POST',
        headers: { 'X-Admin-Token': tk.value, 'Content-Type': 'application/json' },
        body: JSON.stringify({ delta: delta, comment: comment.trim() }),
      }).catch(function() { return null; });
      if (!r) { showError('Ошибка сети'); return; }
      var data = await r.json().catch(function() { return null; });
      if (!r.ok) { alert((data && data.detail) || 'Ошибка корректировки бонусов'); return; }
      var txWasOpen = window.adminOpenTx && window.adminOpenTx[cardId];
      if (window.adminTxCache) delete window.adminTxCache[cardId];
      if (window.adminTxCacheMode) delete window.adminTxCacheMode[cardId];
      if (txWasOpen) {
        window.adminOpenTx[cardId] = false;
        await loadBonusCards(document.getElementById('bonus-search-phone').value || undefined);
        await window.adminShowTx(cardId);
      } else {
        await loadBonusCards(document.getElementById('bonus-search-phone').value || undefined);
      }
    };

    var TX_TYPE_LABEL = {
      EARNED: 'Начислено', SPENT: 'Списано', RESERVED: 'Резерв',
      RELEASED: 'Резерв снят', ADMIN_ADD: 'Администратор +', ADMIN_DEDUCT: 'Администратор −',
      EARN_REVERSED: 'Откат начисления', SPEND_REVERSED: 'Откат списания',
    };

    function renderCardOrders(orders) {
      var ORDER_ST = {
        NEW:'Новый', ACCEPTED:'Принят', COOKING:'Готовится',
        ONWAY:'В пути', DONE:'Доставлен', REJECTED:'Отклонён'
      };
      var header = '<div style="font-size:12px;font-weight:600;opacity:.55;'
        + 'margin-top:12px;margin-bottom:4px;border-top:1px solid #eee;padding-top:8px">'
        + 'История заказов этой карты</div>';
      if (!orders || !orders.length) {
        return header + '<div style="font-size:12px;opacity:.6">Заказов по этой карте пока нет</div>';
      }
      var rows = orders.map(function(o) {
        var dt = o.created_at ? o.created_at.slice(0, 10) : '—';
        var st = ORDER_ST[o.status] || escapeHtml(o.status || '');
        var total = o.total_after_bonus != null ? o.total_after_bonus : (o.total_rub || 0);
        var bonusParts = [];
        if (o.bonus_card_created) bonusParts.push('🆕 карта создана');
        if (o.bonus_earn_reversed_at)  bonusParts.push('↩ начисл. отменено' + (o.bonus_earned ? ' ' + o.bonus_earned : ''));
        else if (o.bonus_earned_at)    bonusParts.push('＋' + o.bonus_earned + ' начислено');
        if (o.bonus_spend_reversed_at) bonusParts.push('↩ списание отменено ' + o.bonus_spent);
        else if (o.bonus_spent_at)     bonusParts.push('−' + o.bonus_spent + ' списано');
        else if (o.bonus_released_at)  bonusParts.push('○ резерв снят');
        var bonusLine = bonusParts.length
          ? '<div style="font-size:11px;opacity:.75;margin-top:1px">' + bonusParts.join(' · ') + '</div>'
          : '';
        var items = (o.items || []).slice(0, 3).map(function(i) {
          return escapeHtml(i.name || '') + '\u202F\xd7\u202F' + i.qty;
        }).join(', ') + ((o.items || []).length > 3 ? '…' : '');
        var itemsLine = items
          ? '<div style="font-size:11px;opacity:.55;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + items + '</div>'
          : '';
        return '<div style="padding:5px 0;border-bottom:1px solid #f0f0f0">'
          + '<div style="display:flex;justify-content:space-between;align-items:baseline">'
          + '<span style="font-size:12px">' + escapeHtml(o.id) + ' · ' + st + '</span>'
          + '<span style="font-size:12px;font-weight:600">' + total + '₽</span>'
          + '</div>'
          + '<div style="font-size:11px;opacity:.55">' + dt + (o.is_test ? ' · тест' : '') + '</div>'
          + bonusLine + itemsLine
          + '</div>';
      }).join('');
      return header + rows;
    }

    window.adminShowTx = async function adminShowTx(cardId) {
      window.adminOpenTx = window.adminOpenTx || {};
      window.adminTxCache = window.adminTxCache || {};
      window.adminTxCacheMode = window.adminTxCacheMode || {};
      var el = document.getElementById('tx-' + cardId);
      if (!el) return;

      if (window.adminOpenTx[cardId]) {
        window.adminOpenTx[cardId] = false;
        el.style.display = 'none';
        var btn = el.previousElementSibling && el.previousElementSibling.querySelector('button[onclick^="adminShowTx"]');
        if (btn) btn.textContent = 'История';
        return;
      }

      var isMobile = window.innerWidth <= 640;
      var currentMode = isMobile ? 'mobile' : 'desktop';
      if (window.adminTxCacheMode[cardId] && window.adminTxCacheMode[cardId] !== currentMode) {
        delete window.adminTxCache[cardId];
      }

      window.adminOpenTx[cardId] = true;
      if (!window.adminTxCache[cardId]) {
        el.innerHTML = '<span style="opacity:.5;font-size:12px">Загрузка...</span>';
        el.style.display = '';
        var tk = sanitizeToken(tok());
        if (tk.error) { el.innerHTML = '<span style="color:red;font-size:12px">' + escapeHtml(tk.error) + '</span>'; return; }
        var r = await fetch(base() + '/api/admin/bonus-cards/' + cardId + '/transactions?limit=50', {
          headers: { 'X-Admin-Token': tk.value },
        }).catch(function() { return null; });
        if (!r || !r.ok) {
          el.innerHTML = '<span style="color:red;font-size:12px">Ошибка загрузки истории</span>';
          window.adminOpenTx[cardId] = false;
          return;
        }
        var txs = await r.json().catch(function() { return []; });
        var txHtml;
        if (!txs.length) {
          txHtml = '<span style="opacity:.6;font-size:12px">Операций нет</span>';
        } else if (isMobile) {
          var cards = txs.map(function(t) {
            var dt = t.created_at ? t.created_at.slice(0, 16).replace('T', ' ') : '—';
            var label = TX_TYPE_LABEL[t.type] || escapeHtml(t.type);
            var sign = (t.type === 'EARNED' || t.type === 'ADMIN_ADD' || t.type === 'SPEND_REVERSED') ? '+' :
                       (t.type === 'RESERVED' || t.type === 'RELEASED') ? '' : '−';
            var extra = '';
            if (t.comment) extra += escapeHtml(t.comment);
            if (t.order_id) extra += (extra ? ' · ' : '') + 'заказ ' + escapeHtml(t.order_id);
            return '<div style="padding:5px 0;border-bottom:1px solid #eee">'
              + '<div style="display:flex;justify-content:space-between;align-items:baseline">'
              + '<span style="opacity:.6;font-size:11px">' + escapeHtml(dt) + '</span>'
              + '<b style="font-size:12px">' + sign + t.amount + '</b>'
              + '</div>'
              + '<div style="font-size:12px">' + label + '</div>'
              + (extra ? '<div style="font-size:11px;opacity:.7;overflow-wrap:anywhere;word-break:break-word">' + extra + '</div>' : '')
              + '</div>';
          }).join('');
          txHtml = '<div style="max-width:100%;overflow:hidden">' + cards + '</div>';
        } else {
          var rows = txs.map(function(t) {
            var dt = t.created_at ? t.created_at.slice(0, 16).replace('T', ' ') : '—';
            var label = TX_TYPE_LABEL[t.type] || escapeHtml(t.type);
            var sign = (t.type === 'EARNED' || t.type === 'ADMIN_ADD' || t.type === 'SPEND_REVERSED') ? '+' :
                       (t.type === 'RESERVED' || t.type === 'RELEASED') ? '' : '−';
            var comment = t.comment ? ' · ' + escapeHtml(t.comment) : '';
            var orderId = t.order_id ? ' · заказ&nbsp;' + escapeHtml(t.order_id) : '';
            return '<tr>'
              + '<td style="padding:2px 6px;opacity:.6;white-space:nowrap">' + escapeHtml(dt) + '</td>'
              + '<td style="padding:2px 6px">' + label + '</td>'
              + '<td style="padding:2px 6px;font-weight:600">' + sign + t.amount + '</td>'
              + '<td style="padding:2px 6px;opacity:.7">' + comment + orderId + '</td>'
              + '</tr>';
          }).join('');
          txHtml = '<table style="font-size:12px;border-collapse:collapse;width:100%">'
            + '<thead><tr style="opacity:.5">'
            + '<th style="padding:2px 6px;text-align:left">Дата</th>'
            + '<th style="padding:2px 6px;text-align:left">Тип</th>'
            + '<th style="padding:2px 6px;text-align:left">Сумма</th>'
            + '<th style="padding:2px 6px;text-align:left">Комментарий</th>'
            + '</tr></thead><tbody>' + rows + '</tbody></table>';
        }
        var rO = await fetch(base() + '/api/admin/bonus-cards/' + cardId + '/orders?limit=20', {
          headers: { 'X-Admin-Token': tk.value },
        }).catch(function() { return null; });
        var cardOrders = (rO && rO.ok) ? await rO.json().catch(function() { return []; }) : [];
        window.adminTxCache[cardId] = txHtml + renderCardOrders(cardOrders);
        window.adminTxCacheMode[cardId] = currentMode;
      }
      el.innerHTML = window.adminTxCache[cardId];
      el.style.display = '';
      var btn = el.previousElementSibling && el.previousElementSibling.querySelector('button[onclick^="adminShowTx"]');
      if (btn) btn.textContent = 'Скрыть историю';
    };

    function renderStatsV2(s) {
      const stages = [
        ['menu_open',     '📋 Меню'],
        ['cart_add',      '➕ В корзину'],
        ['cart_open',     '🛒 Корзина'],
        ['order_created', '✅ Заказ'],
      ];
      const chLabels = { web: '🌐 Web', telegram: '💬 Telegram', total: '📊 Итого' };
      const channels = ['web', 'telegram', 'total'];

      function periodTable(period, label) {
        const headerCells = channels.map(ch => `<th colspan="2" style="text-align:center;padding:4px 8px">${chLabels[ch]}</th>`).join('');
        const subHeader = channels.map(() => `<th style="text-align:right;padding:2px 8px;font-weight:400;opacity:.6">Всего</th><th style="text-align:right;padding:2px 8px;font-weight:400;opacity:.6">Без повторов</th>`).join('');
        const rows = stages.map(([key, lbl]) => {
          const cells = channels.map(ch => {
            const d = period[ch]?.[key] || { raw: 0, unique: 0 };
            return `<td style="text-align:right;padding:3px 8px">${d.raw}</td><td style="text-align:right;padding:3px 8px;opacity:.7">${d.unique}</td>`;
          }).join('');
          return `<tr><td style="padding:3px 8px">${lbl}</td>${cells}</tr>`;
        }).join('');
        return `
          <div style="margin-bottom:12px">
            <b>${label}</b>
            <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:4px">
              <tr><th></th>${headerCells}</tr>
              <tr><th></th>${subHeader}</tr>
              ${rows}
            </table>
          </div>`;
      }

      function periodCards(period, label) {
        const cards = channels.map(ch => {
          const chData = period[ch] || {};
          const rows = stages.map(([key, lbl]) => {
            const d = chData[key] || { raw: 0, unique: 0 };
            return `<tr><td style="padding:2px 0">${lbl}</td><td style="text-align:right;padding:2px 6px">${d.raw}</td><td style="text-align:right;padding:2px 0">${d.unique}</td></tr>`;
          }).join('');
          return `<div style="border:1px solid #eee;border-radius:8px;padding:8px 12px;margin-bottom:6px">
            <div style="font-size:14px;font-weight:600;margin-bottom:4px">${chLabels[ch]}</div>
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <tr><th></th><th style="text-align:right;padding:0 6px;font-weight:400;opacity:.5;font-size:11px">Всего</th><th style="text-align:right;font-weight:400;opacity:.5;font-size:11px">Уник.</th></tr>
              ${rows}
            </table>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:12px"><b>${label}</b><div style="margin-top:4px">${cards}</div></div>`;
      }

      document.getElementById('stats-v2').innerHTML = `
        <div class="stats-desktop">
          ${periodTable(s.today, `Сегодня (${fmtDate(s.since_today)})`)}
          ${periodTable(s.month, `Месяц (с ${fmtDate(s.since_month)})`)}
        </div>
        <div class="stats-mobile">
          ${periodCards(s.today, `Сегодня (${fmtDate(s.since_today)})`)}
          ${periodCards(s.month, `Месяц (с ${fmtDate(s.since_month)})`)}
        </div>`;
    }

    function toggleCategory(catKey) {
      if (openCategories.has(catKey)) openCategories.delete(catKey);
      else openCategories.add(catKey);
      const items = document.getElementById('cat-items-' + catKey);
      const arrow = document.getElementById('cat-arrow-' + catKey);
      if (items) items.style.display = openCategories.has(catKey) ? 'block' : 'none';
      if (arrow) arrow.textContent = openCategories.has(catKey) ? '▲' : '▼';

    function renderStock(categories) {

      if (!categories.length) { el.innerHTML = ''; return; }
      const sections = categories.map((cat, idx) => {
        const catKey = String(cat.id ?? idx);
        const catLabel = cat.name ?? catKey;

        const isOpen = openCategories.has(catKey);

          <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0">
            <span style="font-size:14px">${item.in_stock !== false ? '✅' : '❌'} ${item.name}</span>

              <span style="font-size:14px;font-weight:600">${catLabel}${unavailable ? ` — ${unavailable} нет` : ''}</span>

            <div id="cat-items-${catKey}" style="display:${isOpen ? 'block' : 'none'};padding:0 12px">

      }).join('');
      el.innerHTML = `<h3 style="margin:16px 0 8px;font-size:15px">Наличие товаров</h3>${sections}`;

    async function setStock(catKey, itemId, inStock) {
      openCategories.add(catKey);
      clearStockError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showStockError(tokenError); return; }
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/stock?in_stock=${inStock}`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showStockError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) return;
      if (!r.ok) { showStockError(await parseError(r)); return; }
      load();
    }

    async function setStatus(id, status) {
      clearError(true);
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showError(tokenError); return; }
      const r = await fetch(`${base()}/api/orders/${id}/status?status=${status}`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) return;
      if (!r.ok) { showError(await parseError(r)); return; }
      load(); // reload only on success
    }

    async function saveNote(orderId, inputId, btnId) {
      const note = document.getElementById(inputId)?.value ?? '';
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showError(tokenError); return; }
      const r = await fetch(`${base()}/api/orders/${orderId}/note?note=${encodeURIComponent(note)}`, {
        method: 'POST', headers: { 'X-Admin-Token': token },
      }).catch(() => null);
      const btn = document.getElementById(btnId);
      if (r && r.ok && btn) {
        const orig = btn.textContent;
        btn.textContent = '✓ Сохранено';
        setTimeout(() => { btn.textContent = orig; }, 2000);
      }
    }
    // ── Редактор товаров ──────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let editorCatalog = [];
    let hotEditorCatalog = [];
    let editorLoadedOnce = false;
    let activePromosOpen = false;

    function showEditorError(msg) { document.getElementById('editor-error').textContent = msg; }
    function clearEditorError()   { document.getElementById('editor-error').textContent = ''; }

    function renderEditor(categories, hotCategories) {
      if (editorLoadedOnce) return;
      editorLoadedOnce = true;
      editorCatalog = categories;
      hotEditorCatalog = hotCategories || [];
      const el = document.getElementById('editor');
      if (!categories.length && !hotEditorCatalog.length) { el.innerHTML = ''; return; }
      const renderSection = (cats, isHot) => cats.map(cat => `
        <div style="margin-bottom:16px">
          <div style="font-size:14px;font-weight:600;margin:10px 0 6px;opacity:.7">${cat.emoji || ''} ${esc(cat.name)}</div>
          ${renderCategoryPromoPanel(cat, isHot)}
          ${(cat.items || []).map((item, idx) => renderItemRow(item, idx, cat, isHot)).join('')}
        </div>
      `).join('');
      el.innerHTML =
        renderActivePromosPanel() +
        (hotEditorCatalog.length ? `<div style="font-size:13px;font-weight:700;margin:10px 0 8px;padding:8px 10px;background:#fff3e0;border-radius:8px;color:#b94a00">🔥 Готовое меню — цены на витрине «Горячее»</div>` + renderSection(hotEditorCatalog, true) : '') +
        (categories.length ? `<div style="font-size:13px;font-weight:700;margin:18px 0 8px;padding:8px 10px;background:#e8f4ff;border-radius:8px;color:#1a5fa8">❄️ Заморозка</div>` + renderSection(categories, false) : '');
    }

    function renderItemRow(item, idx, cat, isHot) {
      const hasPromoPrice = item.old_price != null && Number(item.old_price) > Number(item.price);
      const displayBasePrice = hasPromoPrice ? item.old_price : item.price;
      const displayPromoPrice = hasPromoPrice ? item.price : '';
      return `
        <div id="erow-${esc(item.id)}" oninput="markItemDirty('${esc(item.id)}')" style="border:1px solid #ddd;border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fafafa">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:13px;font-weight:600">${esc(item.name)}</span>
            <span style="display:flex;gap:4px">
              <button onclick="moveItem('${esc(cat.id)}','${esc(item.id)}',-1)" style="padding:5px 10px;font-size:14px;border:1px solid #999;border-radius:6px;background:#e8e8e8;color:#333;cursor:pointer;font-weight:700;line-height:1" ${idx===0?'disabled':''}>↑</button>
              <button onclick="moveItem('${esc(cat.id)}','${esc(item.id)}',1)"  style="padding:5px 10px;font-size:14px;border:1px solid #999;border-radius:6px;background:#e8e8e8;color:#333;cursor:pointer;font-weight:700;line-height:1" ${idx===cat.items.length-1?'disabled':''}>↓</button>
            </span>
          </div>
          <div style="display:grid;grid-template-columns:0.7fr 1.3fr;gap:6px;margin-bottom:6px">
            <label style="font-size:12px;opacity:.6">${isHot ? 'Обычная цена за порцию (₽)' : 'Обычная цена (₽)'}
              <input id="ep-${esc(item.id)}" type="number" step="1" value="${esc(displayBasePrice ?? '')}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
            </label>
            <label style="font-size:12px;opacity:.6">Заголовок
              <input id="et-${esc(item.id)}" value="${esc(item.title||'')}" placeholder="${esc(item.name)}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
            </label>
            <label style="font-size:12px;opacity:.6">Подзаголовок
              <input id="eu-${esc(item.id)}" value="${esc(item.subtitle||'')}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
            </label>
          </div>
          <div style="padding-top:6px;margin-bottom:6px">
            <div style="font-size:11px;font-weight:600;opacity:.45;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Промо</div>
            <div style="display:grid;grid-template-columns:0.7fr 1.3fr;gap:6px;margin-bottom:6px">
              <label style="font-size:12px;opacity:.6">${isHot ? 'Цена по акции за порцию (₽)' : 'Цена по акции (₽)'}
                <input id="eop-${esc(item.id)}" type="number" step="1" value="${esc(displayPromoPrice)}" placeholder="не задана" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
              </label>
              <label style="font-size:12px;opacity:.6">Плашка акции
                <input id="epl-${esc(item.id)}" value="${esc(item.promo_label ?? '')}" placeholder="Акция" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
              </label>
            </div>
            <label style="font-size:12px;opacity:.6;display:flex;align-items:center;gap:6px;cursor:pointer">
              <input id="eprom-${esc(item.id)}" type="checkbox" ${item.promo_enabled ? 'checked' : ''}>
              Показывать плашку акции
            </label>
          </div>
          ${isHot ? `<div style="padding-top:8px;margin-top:4px;border-top:1px solid #f0f0f0;margin-bottom:6px">
            <div style="font-size:11px;font-weight:600;opacity:.45;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Детали порции</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
              <label style="font-size:12px;opacity:.5">Время приготовления
                <input id="ewt-${esc(item.id)}" value="${esc(item.wait_time||'')}" placeholder="напр. 30–40 минут" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #eee;border-radius:6px;font-size:13px;box-sizing:border-box">
              </label>
              <label style="font-size:12px;opacity:.5">Порция / примечание
                <input id="epnote-${esc(item.id)}" value="${esc(item.portion_note||'')}" placeholder="напр. порция 10 штук" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #eee;border-radius:6px;font-size:13px;box-sizing:border-box">
              </label>
            </div>
          </div>` : ''}
          <div style="display:flex;gap:6px;margin-bottom:4px">
            <button onclick="saveItem('${esc(item.id)}')" style="padding:6px 16px;border:none;border-radius:6px;background:#3390ec;color:#fff;font-size:13px;cursor:pointer">Сохранить</button>
            <button onclick="reloadItem('${esc(item.id)}')" style="padding:6px 14px;border:none;border-radius:6px;background:#eee;color:#333;font-size:13px;cursor:pointer">Сбросить изменения</button>
          </div>
          <div><span id="emsg-${esc(item.id)}" style="font-size:12px;opacity:.6"></span></div>
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <img id="ethumb-${esc(item.id)}" src="${esc(item.image||'')}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #eee;${item.image?'':'display:none'}">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <input id="efile-${esc(item.id)}" type="file" accept="image/jpeg,image/png,image/webp" style="font-size:12px;max-width:180px">
              <button onclick="uploadImage('${esc(item.id)}')" style="padding:5px 12px;border:none;border-radius:6px;background:#555;color:#fff;font-size:12px;cursor:pointer">Загрузить фото</button>
              <button id="edelete-${esc(item.id)}" onclick="deleteImage('${esc(item.id)}')" style="padding:5px 12px;border:none;border-radius:6px;background:#e74c3c;color:#fff;font-size:12px;cursor:pointer;${(item.image||'').startsWith('/uploads/items/')?'':'display:none'}">Удалить фото</button>
              <span id="eimgmsg-${esc(item.id)}" style="font-size:12px;opacity:.6"></span>
            </div>
          </div>
        </div>
      `;
    }

    function setCategoryPromoMsg(catId, isHot, text, isError = false) {
      const cid = (isHot ? 'hot-' : 'frozen-') + catId;
      const msgEl = document.getElementById(`cpmsg-${cid}`);
      if (!msgEl) return;
      msgEl.textContent = text;
      msgEl.style.cssText = isError
        ? 'font-size:12px;color:#b91c1c;opacity:.95'
        : 'font-size:12px;opacity:.8';
    }

    function isActivePromoItem(item) {
      const p  = Number(item.price);
      const op = Number(item.old_price);
      const hasOldPrice = item.old_price != null && Number.isFinite(op) && Number.isFinite(p) && op > p;
      return item.promo_enabled === true || hasOldPrice;
    }

    function getActivePromoItems() {
      const result = [];
      for (const cat of hotEditorCatalog) for (const item of cat.items || []) if (isActivePromoItem(item)) result.push({ item, cat, isHot: true });
      for (const cat of editorCatalog)    for (const item of cat.items || []) if (isActivePromoItem(item)) result.push({ item, cat, isHot: false });
      return result;
    }

    function hasDirtyItem(itemId) {
      return document.getElementById(`emsg-${itemId}`)?.textContent === 'Есть несохранённые изменения';
    }

    function hasAnyDirtyItems() {
      return [...editorCatalog, ...hotEditorCatalog]
        .flatMap(c => c.items || [])
        .some(item => hasDirtyItem(item.id));
    }

    function setActivePromosMsg(text, isError = false) {
      const el = document.getElementById('active-promos-msg');
      if (!el) return;
      el.textContent = text;
      el.style.cssText = isError
        ? 'font-size:12px;color:#b91c1c;opacity:.95'
        : 'font-size:12px;opacity:.8';
    }

    function renderActivePromosPanel() {
      const activeItems = getActivePromoItems();
      const count = activeItems.length;
      const toggleLabel = activePromosOpen ? 'Скрыть' : 'Показать';
      const rows = activeItems.map(({ item, cat, isHot }) => {
        const op = Number(item.old_price);
        const p  = Number(item.price);
        const hasOldPrice = item.old_price != null && Number.isFinite(op) && Number.isFinite(p) && op > p;
        const priceStr = hasOldPrice ? `${op}₽ → ${p}₽` : `${p}₽`;
        const modeLabel = isHot ? 'Горячее' : 'Заморозка';
        const itemIdArg = JSON.stringify(item.id);
        return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f0ebe0;flex-wrap:wrap">
          <span style="font-size:12px;opacity:.6">${modeLabel} · ${esc(cat.name)} · ${esc(item.name || item.title || item.id)}</span>
          <span style="font-size:12px;font-weight:600">${priceStr}</span>
          ${item.promo_enabled ? `<span style="font-size:11px;color:#b94a00">· «${esc(item.promo_label || 'Акция')}»</span>` : ''}
          <button onclick='clearItemPromoFromActiveList(${itemIdArg}, ${isHot})' style="padding:2px 10px;border:none;border-radius:4px;background:#fee2e2;color:#b91c1c;font-size:11px;cursor:pointer;margin-left:auto">Убрать</button>
        </div>`;
      }).join('');
      const bodyHtml = activePromosOpen ? `<div style="margin-top:8px">
        ${count ? rows : '<span style="font-size:13px;opacity:.5">Активных акций нет</span>'}
        ${count ? `<div style="margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button onclick="clearAllActivePromos()" style="padding:4px 12px;border:none;border-radius:6px;background:#fee2e2;color:#b91c1c;font-size:12px;cursor:pointer;font-weight:600">Убрать все акции</button>
        </div>` : ''}
      </div>` : '';
      return `<div id="active-promos-panel" style="margin-bottom:12px;padding:8px 12px;border:1px solid #e8d5b0;border-radius:8px;background:#fffbf3">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:11px;font-weight:700;opacity:.55;text-transform:uppercase;letter-spacing:.5px">Активные акции · ${count}</span>
          <button onclick="toggleActivePromosPanel()" style="padding:2px 8px;border:none;border-radius:4px;background:#ede8e0;color:#555;font-size:11px;cursor:pointer">${toggleLabel}</button>
          <span id="active-promos-msg" style="font-size:12px;opacity:.6"></span>
        </div>
        ${bodyHtml}
      </div>`;
    }

    function refreshActivePromosPanel() {
      const panel = document.getElementById('active-promos-panel');
      if (panel) panel.outerHTML = renderActivePromosPanel();
    }

    function toggleActivePromosPanel() {
      activePromosOpen = !activePromosOpen;
      refreshActivePromosPanel();
    }

    async function clearItemPromoFromActiveList(itemId, isHot) {
      if (hasDirtyItem(itemId)) { setActivePromosMsg('Сначала сохраните изменения этого товара.', true); return; }
      const { value: token, error } = sanitizeToken(tok());
      if (error) { setActivePromosMsg(error, true); return; }
      const localCats = isHot ? hotEditorCatalog : editorCatalog;
      let foundCat = null, foundItem = null;
      for (const cat of localCats) {
        const item = (cat.items || []).find(i => i.id === itemId);
        if (item) { foundCat = cat; foundItem = item; break; }
      }
      if (!foundItem) return;
      const op = Number(foundItem.old_price);
      const p  = Number(foundItem.price);
      const body = { old_price: null, promo_enabled: false, promo_label: '' };
      if (foundItem.old_price != null && Number.isFinite(op) && Number.isFinite(p) && op > p) body.price = op;
      const r = await patchItemSilent(itemId, body, token);
      if (!r || !r.ok) { setActivePromosMsg('Не удалось обновить товар.', true); return; }
      await reloadCategoryRows(foundCat.id, isHot);
      refreshActivePromosPanel();
      setActivePromosMsg('✓ Акция убрана.');
    }

    async function clearAllActivePromos() {
      if (hasAnyDirtyItems()) { setActivePromosMsg('Сначала сохраните изменения товаров.', true); return; }
      const loaded = await reloadEditorCatalogFromServer();
      if (!loaded) { setActivePromosMsg('Не удалось загрузить актуальный каталог.', true); return; }
      const items = getActivePromoItems();
      if (!items.length) { refreshActivePromosPanel(); setActivePromosMsg('Активных акций нет.'); return; }
      if (!confirm(`Убрать акции у ${items.length} товар(а/ов)?`)) return;
      const { value: token, error } = sanitizeToken(tok());
      if (error) { setActivePromosMsg(error, true); return; }
      setActivePromosMsg('Применяю…');
      let okCount = 0; const failNames = [];
      for (const { item } of items) {
        const op = Number(item.old_price);
        const p  = Number(item.price);
        const body = { old_price: null, promo_enabled: false, promo_label: '' };
        if (item.old_price != null && Number.isFinite(op) && Number.isFinite(p) && op > p) body.price = op;
        const r = await patchItemSilent(item.id, body, token);
        if (r && r.ok) { okCount++; } else { failNames.push(item.name || item.id); }
      }
      const seen = new Set();
      for (const { cat, isHot } of items) {
        const key = `${isHot}:${cat.id}`;
        if (!seen.has(key)) { seen.add(key); await reloadCategoryRows(cat.id, isHot); }
      }
      refreshActivePromosPanel();
      const msg = failNames.length
        ? `✓ Убрано: ${okCount} / не удалось: ${failNames.join(', ')}`
        : `✓ Убрано: ${okCount} товар(а/ов)`;
      setActivePromosMsg(msg);
    }

    function hasCategoryDirtyItems(cat) {
      return (cat.items || []).some(item =>
        document.getElementById(`emsg-${item.id}`)?.textContent === 'Есть несохранённые изменения'
      );
    }

    function calcBasePrice(item) {
      const p  = Number(item.price);
      const op = Number(item.old_price);
      if (!Number.isFinite(p)) return null;
      if (item.old_price != null && Number.isFinite(op) && op > p) return op;
      return p;
    }

    function roundPrice(price, rounding) {
      if (rounding === 5)  return Math.round(price / 5)  * 5;
      if (rounding === 10) return Math.round(price / 10) * 10;
      return Math.round(price);
    }

    function renderCategoryPromoPanel(cat, isHot) {
      const cid = `${isHot ? 'hot-' : 'frozen-'}${cat.id}`;
      const cidAttr = esc(cid);
      const catIdArg = JSON.stringify(cat.id);
      return `
        <div style="margin-bottom:10px;padding:10px 12px;border:1px solid #e8d5b0;border-radius:8px;background:#fffbf3">
          <div style="font-size:11px;font-weight:700;opacity:.55;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Акция по категории</div>
          <div style="display:grid;grid-template-columns:80px 1fr auto;gap:6px;align-items:end;margin-bottom:6px">
            <label style="font-size:12px;opacity:.6">Скидка, %
              <input id="cpct-${cidAttr}" type="number" min="1" max="99" step="1" placeholder="10" style="width:100%;margin-top:2px;padding:4px 7px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
            </label>
            <label style="font-size:12px;opacity:.6">Плашка
              <input id="cplbl-${cidAttr}" placeholder="Скидка 10%" style="width:100%;margin-top:2px;padding:4px 7px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">
            </label>
            <label style="font-size:12px;opacity:.6">Округление
              <select id="cprd-${cidAttr}" style="margin-top:2px;padding:5px 7px;border:1px solid #ddd;border-radius:6px;font-size:13px">
                <option value="0">без</option>
                <option value="5">до 5₽</option>
                <option value="10">до 10₽</option>
              </select>
            </label>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
            <button onclick='previewCategoryDiscount(${catIdArg}, ${isHot})' style="padding:5px 12px;border:none;border-radius:6px;background:#eee;color:#333;font-size:12px;cursor:pointer">Предпросмотр</button>
            <button onclick='applyCategoryDiscount(${catIdArg}, ${isHot})' style="padding:5px 12px;border:none;border-radius:6px;background:#3390ec;color:#fff;font-size:12px;cursor:pointer">Применить скидку</button>
            <button onclick='applyCategoryPromoLabel(${catIdArg}, ${isHot})' style="padding:5px 12px;border:none;border-radius:6px;background:#eee;color:#555;font-size:12px;cursor:pointer">Поставить плашку</button>
            <button onclick='clearCategoryPromo(${catIdArg}, ${isHot})' style="padding:5px 12px;border:none;border-radius:6px;background:#fee2e2;color:#b91c1c;font-size:12px;cursor:pointer">Убрать акцию</button>
            <span id="cpmsg-${cidAttr}" style="font-size:12px;opacity:.6"></span>
          </div>
        </div>`;
    }

    async function patchItemSilent(itemId, body, token) {
      return fetch(`${base()}/api/admin/catalog/items/${itemId}`, {
        method: 'PATCH',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(() => null);
    }

    function getCatAndToken(catId, isHot) {
      const { value: token, error } = sanitizeToken(tok());
      if (error) { showEditorError(error); return null; }
      const localCats = isHot ? hotEditorCatalog : editorCatalog;
      const cat = localCats.find(c => c.id === catId);
      if (!cat) return null;
      return { cat, token };
    }

    async function reloadCategoryRows(catId, isHot) {
      const r = await fetch(`${base()}/api/catalog`).catch(() => null);
      if (!r || !r.ok) return;
      const data = await r.json();
      const serverCats = isHot ? (data.hot_categories || []) : (data.categories || []);
      const serverCat = serverCats.find(c => c.id === catId);
      if (!serverCat) return;
      const localCats = isHot ? hotEditorCatalog : editorCatalog;
      const localCat = localCats.find(c => c.id === catId);
      if (!localCat) return;
      localCat.items = serverCat.items;
      for (const [idx, item] of serverCat.items.entries()) {
        const row = document.getElementById(`erow-${item.id}`);
        if (row) row.outerHTML = renderItemRow(item, idx, localCat, isHot);
      }
    }

    async function reloadEditorCatalogFromServer() {
      const r = await fetch(`${base()}/api/catalog`).catch(() => null);
      if (!r || !r.ok) return false;
      const data = await r.json();
      editorCatalog = data.categories || [];
      hotEditorCatalog = data.hot_categories || [];
      return true;
    }

    function previewCategoryDiscount(catId, isHot) {
      const res = getCatAndToken(catId, isHot);
      if (!res) return;
      const { cat } = res;
      const cid = (isHot ? 'hot-' : 'frozen-') + catId;
      const percent = Number(document.getElementById(`cpct-${cid}`)?.value);
      if (!Number.isFinite(percent) || percent < 1 || percent > 99) { alert('Введите процент скидки от 1 до 99.'); return; }
      const rounding = parseInt(document.getElementById(`cprd-${cid}`)?.value || '0', 10);
      const lines = (cat.items || []).map(item => {
        const base = calcBasePrice(item);
        if (base === null) return `${item.name || item.id}: невалидная цена — пропущен`;
        const newP = roundPrice(base * (1 - percent / 100), rounding);
        return `${item.name || item.id}: ${base} → ${newP}`;
      });
      alert(`Будет изменено: ${lines.length} товар(а/ов)\n\n${lines.join('\n')}`);
    }

    async function applyCategoryDiscount(catId, isHot) {
      const res = getCatAndToken(catId, isHot);
      if (!res) return;
      const { cat, token } = res;
      if (hasCategoryDirtyItems(cat)) { setCategoryPromoMsg(catId, isHot, 'Сначала сохраните изменения товаров в этой категории.', true); return; }
      const cid = (isHot ? 'hot-' : 'frozen-') + catId;
      const percent = Number(document.getElementById(`cpct-${cid}`)?.value);
      if (!Number.isFinite(percent) || percent < 1 || percent > 99) { alert('Введите процент скидки от 1 до 99.'); return; }
      const rounding = parseInt(document.getElementById(`cprd-${cid}`)?.value || '0', 10);
      const label = document.getElementById(`cplbl-${cid}`)?.value?.trim() || `Скидка ${percent}%`;
      const items = cat.items || [];
      const lines = items.map(item => {
        const base = calcBasePrice(item);
        if (base === null) return `${item.name || item.id}: невалидная цена — пропущен`;
        return `${item.name || item.id}: ${base} → ${roundPrice(base * (1 - percent / 100), rounding)}`;
      });
      if (!confirm(`Применить скидку ${percent}% к ${items.length} товар(а/ов)?\n\n${lines.join('\n')}`)) return;

        if (r && r.ok) { okCount++; } else { failNames.push(item.name || item.id); }

    async function saveItem(itemId) {
      clearEditorError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      const basePriceRaw = document.getElementById(`ep-${itemId}`)?.value;
      const basePrice = parseInt(basePriceRaw, 10);
      let in_stock = true;
      for (const cat of [...editorCatalog, ...hotEditorCatalog]) { const it = cat.items.find(i => i.id === itemId); if (it) { in_stock = it.in_stock !== false; break; } }
      const title             = document.getElementById(`et-${itemId}`)?.value ?? '';
      const subtitle          = document.getElementById(`eu-${itemId}`)?.value ?? '';
      const prepWtEl    = document.getElementById(`epwt-${itemId}`);
      const prepPtEl    = document.getElementById(`eppt-${itemId}`);
      const prepNoteEl  = document.getElementById(`epn-${itemId}`);
      const waitTimeEl  = document.getElementById(`ewt-${itemId}`);
      const portionNoteEl = document.getElementById(`epnote-${itemId}`);
      const promoPriceRaw = document.getElementById(`eop-${itemId}`)?.value;
      const promoPrice = parseInt(promoPriceRaw, 10);
      const hasPromo = !!(promoPriceRaw?.trim() && !isNaN(promoPrice) && !isNaN(basePrice) && promoPrice < basePrice);
      const body = { in_stock };
      if (hasPromo) {
        body.price = promoPrice;
        body.old_price = basePrice;
      } else {
        if (!isNaN(basePrice)) body.price = basePrice;
        body.old_price = null;
      }
      body.title    = title;
      body.subtitle = subtitle;
      if (prepWtEl)     body.prepared_wait_time  = prepWtEl.value;
      if (prepPtEl)     body.prepared_price_text = prepPtEl.value;
      if (prepNoteEl)   body.prepared_note       = prepNoteEl.value;
      if (waitTimeEl)   body.wait_time           = waitTimeEl.value;
      if (portionNoteEl) body.portion_note       = portionNoteEl.value;
      const promoLabelEl = document.getElementById(`epl-${itemId}`);
      if (promoLabelEl) body.promo_label = promoLabelEl.value;
      const promoEnabledEl = document.getElementById(`eprom-${itemId}`);
      if (promoEnabledEl) body.promo_enabled = promoEnabledEl.checked;
      const msgEl = document.getElementById(`emsg-${itemId}`);
      if (msgEl) { msgEl.textContent = '…'; msgEl.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}`, {
        method: 'PATCH',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(() => { showEditorError('Не удалось подключиться.'); return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }
      if (msgEl) { msgEl.textContent = '✓ Сохранено'; setTimeout(() => { msgEl.textContent = ''; }, 2000); }
      for (const cat of [...editorCatalog, ...hotEditorCatalog]) {
        const it = (cat.items || []).find(i => i.id === itemId);
        if (it) {
          if ('price' in body) it.price = body.price;
          it.old_price = body.old_price;
          if ('promo_enabled' in body) it.promo_enabled = body.promo_enabled;
          if ('promo_label' in body) it.promo_label = body.promo_label;
          break;
        }
      }
      refreshActivePromosPanel();
    }

    async function uploadImage(itemId) {

      const fileInput = document.getElementById(`efile-${itemId}`);
      if (!fileInput?.files?.length) { showEditorError('Выберите файл'); return; }
      const msgEl = document.getElementById(`eimgmsg-${itemId}`);
      if (msgEl) msgEl.textContent = 'Загружается…';
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/image`, {
        method: 'POST',

        body: fd,
      }).catch(() => { showEditorError('Не удалось подключиться.'); if (msgEl) msgEl.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }

    async function reloadItem(itemId) {
      clearEditorError();
      const r = await fetch(`${base()}/api/catalog`)
        .catch(() => { showEditorError('Не удалось подключиться.'); return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); return; }
      const data = await r.json();
      let found = false;
      const allServerCats = [
        ...(data.categories || []).map(cat => ({ cat, isHot: false })),
        ...(data.hot_categories || []).map(cat => ({ cat, isHot: true })),
      ];
      for (const entry of allServerCats) {
        const cat = entry.cat;
        const isHot = entry.isHot;
        const idx = cat.items.findIndex(i => i.id === itemId);
        if (idx >= 0) {
          found = true;
          const item = cat.items[idx];
          for (const ec of [...editorCatalog, ...hotEditorCatalog]) {
            const ei = ec.items.findIndex(i => i.id === itemId);
            if (ei >= 0) { ec.items[ei] = item; break; }
          }
          const row = document.getElementById(`erow-${itemId}`);
          if (row) row.outerHTML = renderItemRow(item, idx, cat, isHot);
          break;
        }
      }
      if (!found) showEditorError('Не удалось перезагрузить товар с сервера.');
    }

          </div>
          <div style="margin-bottom:6px">
            <label style="font-size:12px;opacity:.6;display:block">Описание<br>
              <textarea id="pd-${i}" rows="2" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;resize:vertical;box-sizing:border-box">${esc(item.description||'')}</textarea>
            </label>
          </div>
          <div>
            <label style="font-size:12px;opacity:.6;display:block">Примечание<br>
              <input id="pn-${i}" value="${esc(item.note||'')}" placeholder="Мелкий шрифт (условия, оговорки)" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;box-sizing:border-box">
            </label>
          </div>
        </div>
      `).join('');
    }

    function renderPromos(data) {
      if (promoDirty) return;
      promoItems = (data.items || []).map(p => ({...p}));
      promoServerJson = JSON.stringify(promoItems.map(p => ({
        id: p.id, title: p.title || '', description: p.description || '', note: p.note || '', active: !!p.active,
      })));
      const body = document.getElementById('promo-body');
      if (!body) return;
      body.innerHTML = '<div id="promo-items"></div>';
      body.oninput = body.onchange = () => { checkPromoDirty(); };
      body.innerHTML += `
        <button onclick="promoAddItem()" style="margin:8px 0;padding:6px 14px;border:none;border-radius:6px;background:#eee;color:#333;font-size:13px;cursor:pointer">+ Добавить предложение</button>
        <div style="margin-top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <button onclick="savePromos()" style="padding:6px 16px;border:none;border-radius:6px;background:#3390ec;color:#fff;font-size:13px;cursor:pointer">Сохранить</button>
          <button onclick="reloadPromos()" style="padding:6px 14px;border:none;border-radius:6px;background:#eee;color:#333;font-size:13px;cursor:pointer">Сбросить изменения</button>
          <span id="promo-msg" style="font-size:12px;opacity:.6"></span>
        </div>
      `;
      renderPromoItems();
    }

    function promoAddItem() {
      commitPromoInputs();
      promoItems.push({ id: `promo-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, title: '', description: '', note: '', active: true });
      renderPromoItems();
      checkPromoDirty();
    }

    function promoRemoveItem(i) {
      if (!confirm('Удалить предложение? Изменение вступит в силу только после сохранения.')) return;
      commitPromoInputs();
      promoItems.splice(i, 1);
      renderPromoItems();
      checkPromoDirty();
    }

    async function savePromos() {
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { document.getElementById('promo-error').textContent = tokenError; return; }
      document.getElementById('promo-error').textContent = '';
      const items = promoItems.map((item, i) => ({
        id: item.id,
        title: (document.getElementById(`pt-${i}`)?.value ?? item.title ?? '').trim(),
        description: (document.getElementById(`pd-${i}`)?.value ?? item.description ?? '').trim(),
        note: (document.getElementById(`pn-${i}`)?.value ?? item.note ?? '').trim(),
        active: document.getElementById(`pa-${i}`)?.checked ?? !!item.active,
      }));
      const invalid = items.filter(it => it.active && !it.title);
      if (invalid.length) {
        document.getElementById('promo-error').textContent = 'Заполните заголовок для всех активных предложений.';
        return;
      }
      const msg = document.getElementById('promo-msg');
      if (msg) { msg.textContent = '…'; msg.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      const r = await fetch(`${base()}/api/admin/content/promotions`, {
        method: 'PUT',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ items }),
      }).catch(() => { document.getElementById('promo-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('promo-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      promoItems = items;
      renderPromoItems();
      promoServerJson = currentPromoJson();
      checkPromoDirty();
      if (msg) { msg.textContent = '✓ Сохранено'; setTimeout(() => { msg.textContent = ''; }, 2000); }
    }

    async function reloadPromos() {
      const msg = document.getElementById('promo-msg');
      if (msg) msg.textContent = '…';
      const r = await fetch(`${base()}/api/content/promotions`)
        .catch(() => { document.getElementById('promo-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('promo-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      const data = await r.json();
      promoDirty = false; setDetailsDirty('promo-details', false);
      if (msg) { msg.textContent = ''; msg.style.cssText = 'font-size:12px;margin-left:8px;opacity:.6'; }
      renderPromos(data);
    }

    window.addEventListener('scroll', function() {
      document.getElementById('back-to-top').style.display =
        window.scrollY > 300 ? 'block' : 'none';
    });
  </script>
  <button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})"
    aria-label="Наверх" title="Наверх"
    style="display:none;position:fixed;bottom:20px;right:20px;z-index:999;
           background:#3390ec;color:#fff;border:none;border-radius:50%;width:44px;height:44px;
           font-size:20px;line-height:1;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.25)">↑</button>
</body>
</html>
