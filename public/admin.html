<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказы — оператор</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    .cfg { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .cfg input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
    .order { border: 1px solid #eee; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .order-meta { font-size: 13px; color: #666; margin-bottom: 6px; }
    .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;
             background: #3390ec; color: #fff; font-size: 13px; }
    .error { color: #c0392b; margin: 8px 0; font-size: 14px; }
    .toggle { background: #eee; color: #555; white-space: nowrap; flex-shrink: 0; }
    .stats-mobile { display: none; }
    @media (max-width: 640px) {
      .stats-desktop { display: none !important; }
      .stats-mobile { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="cfg">
    <input id="apiBase" placeholder="http://127.0.0.1:8000">
    <div style="display:flex;flex:1;gap:4px;min-width:150px;">
      <input id="token" type="password" placeholder="Admin Token" style="min-width:0;">
      <button id="toggleBtn" class="toggle" onclick="toggleToken()">показать</button>
    </div>
    <button onclick="load()">Загрузить</button>
  </div>
  <div id="error" class="error"></div>
  <details id="stats-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Статистика</summary>
    <div id="stats-v2"></div>
  </details>
  <div id="stock"></div>
  <div id="stock-error" class="error"></div>
  <details id="editor-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Редактор товаров</summary>
    <div id="editor-error" class="error"></div>
    <div id="editor"></div>
  </details>
  <details id="wtb-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Где купить</summary>
    <div id="wtb-error" class="error"></div>
    <div id="wtb-body"></div>
  </details>
  <details id="fb-details" style="margin:8px 0;display:none">
    <summary style="cursor:pointer;font-size:15px;font-weight:600;padding:8px 0">Для бизнеса</summary>
    <div id="fb-error" class="error"></div>
    <div id="fb-body"></div>
  </details>
  <div id="orders"></div>

  <script>
    let refreshInterval = null;
    let lastKnownId = null;
    let audioCtx = null;
    let openCategories = new Set();
    let statsLoadedOnce = false;
    let wtbPoints = [];
    let wtbDirty = false;
    let fbDirty = false;

    function beep() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e) {}
    }

    const LABELS = {
      ACCEPTED: '✅ Принят',
      REJECTED:  '❌ Отклонён',
      COOKING:   '🍳 Готовится',
      ONWAY:     '🚗 Выехал',
      DONE:      '✅ Доставлен',
    };

    function base() { return document.getElementById('apiBase').value.replace(/\/$/, ''); }
    function tok()  { return document.getElementById('token').value; }
    function showError(msg) { document.getElementById('error').textContent = msg; }

    function sanitizeToken(raw) {
      let s = raw.trim().replace(/[\u00A0\u200B-\u200D\uFEFF]/g, '');
      for (let i = 0; i < s.length; i++) {
        const code = s.charCodeAt(i);
        if (code < 0x20 || code > 0x7E) {
          const hex = code.toString(16).toUpperCase().padStart(4, '0');
          return { value: null, error: `Токен содержит недопустимый символ "${s[i]}" (U+${hex}) на позиции ${i + 1}` };
        }
      }
      return { value: s, error: null };
    }

    function toggleToken() {
      const el = document.getElementById('token');
      const btn = document.getElementById('toggleBtn');
      if (el.type === 'password') { el.type = 'text'; btn.textContent = 'скрыть'; }
      else { el.type = 'password'; btn.textContent = 'показать'; }
    }
    function clearError()   { document.getElementById('error').textContent = ''; }
    function showStockError(msg) { document.getElementById('stock-error').textContent = msg; }
    function clearStockError()   { document.getElementById('stock-error').textContent = ''; }

    window.onload = () => {
      const saved = localStorage.getItem('apiBase');
      if (saved) document.getElementById('apiBase').value = saved;
      // token intentionally not restored
    };

    async function parseError(r) {
      if (r.status === 403) return 'Неверный токен. Проверьте Admin Token.';
      try {
        const j = await r.json();
        if (r.status >= 500) return `Ошибка сервера${j.detail ? ': ' + j.detail : '. Попробуйте позже.'}`;
        return j.detail || `Ошибка ${r.status}`;
      } catch {
        if (r.status >= 500) return 'Ошибка сервера. Попробуйте позже.';
        return `Ошибка ${r.status}`;
      }
    }

    async function load() {
      clearError();
      localStorage.setItem('apiBase', base());
      if (!audioCtx) { try { audioCtx = new AudioContext(); } catch(e) {} }
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showError(tokenError); return; }
      const r = await fetch(`${base()}/api/orders`, {
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) { clearInterval(refreshInterval); refreshInterval = null; return; }
      if (!r.ok) { showError(await parseError(r)); clearInterval(refreshInterval); refreshInterval = null; return; }
      const orders = await r.json();
      const newId = orders[0]?.id ?? null;
      if (lastKnownId !== null && newId !== null && newId !== lastKnownId) beep();
      lastKnownId = newId ?? lastKnownId;
      render(orders);
      fetch(`${base()}/api/catalog`, { cache: 'no-store' })
        .then(rc => rc.ok ? rc.json() : null)
        .then(catalog => {
          if (catalog) {
            clearStockError();
            renderStock(catalog.categories || []);
            renderEditor(catalog.categories || []);
            document.getElementById('editor-details').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/where-to-buy`)
        .then(r => r.ok ? r.json() : null)
        .then(wtb => {
          if (wtb) {
            renderWtb(wtb);
            document.getElementById('wtb-details').style.display = '';
          }
        })
        .catch(() => {});
      fetch(`${base()}/api/content/for-business`)
        .then(r => r.ok ? r.json() : null)
        .then(fb => {
          if (fb) {
            renderFb(fb);
            document.getElementById('fb-details').style.display = '';
          }
        })
        .catch(() => {});
      if (!statsLoadedOnce) {
        document.getElementById('stats-details').style.display = 'none';
        document.getElementById('stats-v2').innerHTML = '';
      }
      fetch(`${base()}/api/admin/stats/v2`, { headers: { 'X-Admin-Token': token }, cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(stats => {
          if (stats) {
            renderStatsV2(stats);
            document.getElementById('stats-details').style.display = '';
            statsLoadedOnce = true;
          }
        })
        .catch(() => {});
      clearInterval(refreshInterval);
      refreshInterval = setInterval(load, 15000);
    }

    function render(orders) {
      document.getElementById('orders').innerHTML = orders.map(o => `
        <div class="order">
          <div class="order-meta">
            <b>#${o.id}</b> · <b>${o.status}</b> · ${o.total_rub}₽ · ${o.created_at ?? ''}
          </div>
          <div>${o.address ?? ''} · ${o.phone ?? ''}</div>
          ${o.comment ? `<div style="font-size:13px;opacity:.7">${o.comment}</div>` : ''}
          ${(o.items || []).length ? `<div style="font-size:13px;margin-top:4px">Состав:<br>${o.items.map(i =>
            `• ${i.name} — ${i.qty} ${i.unit || 'шт'} × ${Math.round(i.price_rub)}₽`
          ).join('<br>')}</div>` : ''}
          <div class="btns">
            ${Object.entries(LABELS).map(([s, l]) =>
              `<button onclick="setStatus('${o.id}','${s}')">${l}</button>`
            ).join('')}
          </div>
        </div>
      `).join('') || '<div style="opacity:.5">Заказов нет</div>';
    }

    function fmtDate(iso) { const p = iso.split('-'); return `${p[2]}.${p[1]}.${p[0].slice(2)}`; }

    function renderStatsV2(s) {
      const stages = [
        ['menu_open',     '📋 Меню'],
        ['cart_add',      '➕ В корзину'],
        ['cart_open',     '🛒 Корзина'],
        ['order_created', '✅ Заказ'],
      ];
      const chLabels = { web: '🌐 Web', telegram: '💬 Telegram', total: '📊 Итого' };
      const channels = ['web', 'telegram', 'total'];

      function periodTable(period, label) {
        const headerCells = channels.map(ch => `<th colspan="2" style="text-align:center;padding:4px 8px">${chLabels[ch]}</th>`).join('');
        const subHeader = channels.map(() => `<th style="text-align:right;padding:2px 8px;font-weight:400;opacity:.6">Всего</th><th style="text-align:right;padding:2px 8px;font-weight:400;opacity:.6">Без повторов</th>`).join('');
        const rows = stages.map(([key, lbl]) => {
          const cells = channels.map(ch => {
            const d = period[ch]?.[key] || { raw: 0, unique: 0 };
            return `<td style="text-align:right;padding:3px 8px">${d.raw}</td><td style="text-align:right;padding:3px 8px;opacity:.7">${d.unique}</td>`;
          }).join('');
          return `<tr><td style="padding:3px 8px">${lbl}</td>${cells}</tr>`;
        }).join('');
        return `
          <div style="margin-bottom:12px">
            <b>${label}</b>
            <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:4px">
              <tr><th></th>${headerCells}</tr>
              <tr><th></th>${subHeader}</tr>
              ${rows}
            </table>
          </div>`;
      }

      function periodCards(period, label) {
        const cards = channels.map(ch => {
          const chData = period[ch] || {};
          const rows = stages.map(([key, lbl]) => {
            const d = chData[key] || { raw: 0, unique: 0 };
            return `<tr><td style="padding:2px 0">${lbl}</td><td style="text-align:right;padding:2px 6px">${d.raw}</td><td style="text-align:right;padding:2px 0">${d.unique}</td></tr>`;
          }).join('');
          return `<div style="border:1px solid #eee;border-radius:8px;padding:8px 12px;margin-bottom:6px">
            <div style="font-size:14px;font-weight:600;margin-bottom:4px">${chLabels[ch]}</div>
            <table style="width:100%;border-collapse:collapse;font-size:13px">
              <tr><th></th><th style="text-align:right;padding:0 6px;font-weight:400;opacity:.5;font-size:11px">Всего</th><th style="text-align:right;font-weight:400;opacity:.5;font-size:11px">Уник.</th></tr>
              ${rows}
            </table>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:12px"><b>${label}</b><div style="margin-top:4px">${cards}</div></div>`;
      }

      document.getElementById('stats-v2').innerHTML = `
        <div class="stats-desktop">
          ${periodTable(s.today, `Сегодня (${fmtDate(s.since_today)})`)}
          ${periodTable(s.month, `Месяц (с ${fmtDate(s.since_month)})`)}
        </div>
        <div class="stats-mobile">
          ${periodCards(s.today, `Сегодня (${fmtDate(s.since_today)})`)}
          ${periodCards(s.month, `Месяц (с ${fmtDate(s.since_month)})`)}
        </div>`;
    }

    function toggleCategory(catKey) {
      if (openCategories.has(catKey)) openCategories.delete(catKey);
      else openCategories.add(catKey);
      const items = document.getElementById('cat-items-' + catKey);
      const arrow = document.getElementById('cat-arrow-' + catKey);
      if (items) items.style.display = openCategories.has(catKey) ? 'block' : 'none';
      if (arrow) arrow.textContent = openCategories.has(catKey) ? '▲' : '▼';
    }

    function renderStock(categories) {
      const el = document.getElementById('stock');
      if (!categories.length) { el.innerHTML = ''; return; }
      const sections = categories.map((cat, idx) => {
        const catKey = String(cat.id ?? idx);
        const catLabel = cat.name ?? catKey;
        const items = cat.items || [];
        const unavailable = items.filter(i => i.in_stock === false).length;
        const isOpen = openCategories.has(catKey);
        const rows = items.map(item => `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0">
            <span style="font-size:14px">${item.in_stock !== false ? '✅' : '❌'} ${item.name}</span>
            <button onclick="setStock('${catKey}','${item.id}',${item.in_stock !== false ? 'false' : 'true'})"
                    style="font-size:12px;padding:4px 10px">
              ${item.in_stock !== false ? 'Снять' : 'Вернуть'}
            </button>
          </div>`).join('');
        return `
          <div style="border:1px solid #eee;border-radius:6px;margin-bottom:6px">
            <div onclick="toggleCategory('${catKey}')" style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;user-select:none">
              <span style="font-size:14px;font-weight:600">${catLabel}${unavailable ? ` — ${unavailable} нет` : ''}</span>
              <span id="cat-arrow-${catKey}">${isOpen ? '▲' : '▼'}</span>
            </div>
            <div id="cat-items-${catKey}" style="display:${isOpen ? 'block' : 'none'};padding:0 12px">
              ${rows}
            </div>
          </div>`;
      }).join('');
      el.innerHTML = `<h3 style="margin:16px 0 8px;font-size:15px">Наличие товаров</h3>${sections}`;
    }

    async function setStock(catKey, itemId, inStock) {
      openCategories.add(catKey);
      clearStockError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showStockError(tokenError); return; }
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/stock?in_stock=${inStock}`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showStockError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) return;
      if (!r.ok) { showStockError(await parseError(r)); return; }
      load();
    }

    async function setStatus(id, status) {
      clearError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showError(tokenError); return; }
      const r = await fetch(`${base()}/api/orders/${id}/status?status=${status}`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showError('Не удалось подключиться. Проверьте адрес сервера.'); return null; });
      if (!r) return;
      if (!r.ok) { showError(await parseError(r)); return; }
      load(); // reload only on success
    }

    // ── Редактор товаров ──────────────────────────────────────────────
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    let editorCatalog = [];
    let editorLoadedOnce = false;

    function showEditorError(msg) { document.getElementById('editor-error').textContent = msg; }
    function clearEditorError()   { document.getElementById('editor-error').textContent = ''; }

    function renderEditor(categories) {
      if (editorLoadedOnce) return;
      editorLoadedOnce = true;
      editorCatalog = categories;
      const el = document.getElementById('editor');
      if (!categories.length) { el.innerHTML = ''; return; }
      el.innerHTML = categories.map(cat => `
        <div style="margin-bottom:16px">
          <div style="font-size:14px;font-weight:600;margin:10px 0 6px;opacity:.7">${cat.emoji || ''} ${cat.name}</div>
          ${(cat.items || []).map((item, idx) => `
            <div id="erow-${esc(item.id)}" style="border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:6px">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                <span style="font-size:13px;font-weight:600">${esc(item.name)}</span>
                <span style="display:flex;gap:4px">
                  <button onclick="moveItem('${esc(cat.id)}','${esc(item.id)}',-1)" style="padding:2px 7px;font-size:13px;border:1px solid #ddd;border-radius:4px;background:#fafafa;cursor:pointer" ${idx===0?'disabled':''}>↑</button>
                  <button onclick="moveItem('${esc(cat.id)}','${esc(item.id)}',1)"  style="padding:2px 7px;font-size:13px;border:1px solid #ddd;border-radius:4px;background:#fafafa;cursor:pointer" ${idx===cat.items.length-1?'disabled':''}>↓</button>
                </span>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">
                <label style="font-size:12px;opacity:.6">Цена (₽)
                  <input id="ep-${esc(item.id)}" type="number" step="1" value="${esc(item.price ?? '')}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px">
                </label>
                <label style="font-size:12px;opacity:.6">В наличии
                  <select id="es-${esc(item.id)}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px">
                    <option value="true"  ${item.in_stock!==false?'selected':''}>Есть</option>
                    <option value="false" ${item.in_stock===false?'selected':''}>Нет</option>
                  </select>
                </label>
                <label style="font-size:12px;opacity:.6">Заголовок (title)
                  <input id="et-${esc(item.id)}" value="${esc(item.title||'')}" placeholder="${esc(item.name)}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px">
                </label>
                <label style="font-size:12px;opacity:.6">Подзаголовок (subtitle)
                  <input id="eu-${esc(item.id)}" value="${esc(item.subtitle||'')}" style="width:100%;margin-top:2px;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px">
                </label>
              </div>
              <button onclick="saveItem('${esc(item.id)}')" style="padding:6px 16px;border:none;border-radius:6px;background:#3390ec;color:#fff;font-size:13px;cursor:pointer">Сохранить</button>
              <span id="emsg-${esc(item.id)}" style="font-size:12px;margin-left:8px;opacity:.6"></span>
              <div style="margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
                <img id="ethumb-${esc(item.id)}" src="${esc(item.image||'')}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid #eee;${item.image?'':'display:none'}">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                  <input id="efile-${esc(item.id)}" type="file" accept="image/jpeg,image/png,image/webp" style="font-size:12px;max-width:180px">
                  <button onclick="uploadImage('${esc(item.id)}')" style="padding:5px 12px;border:none;border-radius:6px;background:#555;color:#fff;font-size:12px;cursor:pointer">Загрузить фото</button>
                  <button id="edelete-${esc(item.id)}" onclick="deleteImage('${esc(item.id)}')" style="padding:5px 12px;border:none;border-radius:6px;background:#e74c3c;color:#fff;font-size:12px;cursor:pointer;${(item.image||'').startsWith('/uploads/items/')?'':'display:none'}">Удалить фото</button>
                  <span id="eimgmsg-${esc(item.id)}" style="font-size:12px;opacity:.6"></span>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    async function saveItem(itemId) {
      clearEditorError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      const price = parseInt(document.getElementById(`ep-${itemId}`)?.value, 10);
      const in_stock = document.getElementById(`es-${itemId}`)?.value === 'true';
      const title    = document.getElementById(`et-${itemId}`)?.value ?? '';
      const subtitle = document.getElementById(`eu-${itemId}`)?.value ?? '';
      const body = { in_stock };
      if (!isNaN(price)) body.price = price;
      body.title    = title;
      body.subtitle = subtitle;
      const msgEl = document.getElementById(`emsg-${itemId}`);
      if (msgEl) msgEl.textContent = '…';
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}`, {
        method: 'PATCH',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }).catch(() => { showEditorError('Не удалось подключиться.'); return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }
      if (msgEl) { msgEl.textContent = '✓ Сохранено'; setTimeout(() => { msgEl.textContent = ''; }, 2000); }
    }

    async function uploadImage(itemId) {
      clearEditorError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      const fileInput = document.getElementById(`efile-${itemId}`);
      if (!fileInput?.files?.length) { showEditorError('Выберите файл'); return; }
      const msgEl = document.getElementById(`eimgmsg-${itemId}`);
      if (msgEl) msgEl.textContent = 'Загружается…';
      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/image`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token },
        body: fd,
      }).catch(() => { showEditorError('Не удалось подключиться.'); if (msgEl) msgEl.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }
      const data = await r.json();
      if (msgEl) { msgEl.textContent = '✓ Фото обновлено'; setTimeout(() => { msgEl.textContent = ''; }, 3000); }
      const thumb = document.getElementById(`ethumb-${itemId}`);
      if (thumb && data.image) {
        thumb.src = `${base()}${data.image}?t=${Date.now()}`;
        thumb.style.display = '';
      }
      if (data.image && data.image.startsWith('/uploads/items/')) {
        const delBtn = document.getElementById(`edelete-${itemId}`);
        if (delBtn) delBtn.style.display = '';
      }
      for (const cat of editorCatalog) {
        for (const item of cat.items) {
          if (item.id === itemId) { item.image = data.image; break; }
        }
      }
      fileInput.value = '';
    }

    async function deleteImage(itemId) {
      clearEditorError();
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      const msgEl = document.getElementById(`eimgmsg-${itemId}`);
      if (msgEl) msgEl.textContent = 'Удаляется…';
      const r = await fetch(`${base()}/api/admin/catalog/items/${itemId}/image`, {
        method: 'DELETE',
        headers: { 'X-Admin-Token': token },
      }).catch(() => { showEditorError('Не удалось подключиться.'); if (msgEl) msgEl.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); if (msgEl) msgEl.textContent = ''; return; }
      if (msgEl) { msgEl.textContent = '✓ Фото удалено'; setTimeout(() => { msgEl.textContent = ''; }, 3000); }
      const thumb = document.getElementById(`ethumb-${itemId}`);
      if (thumb) { thumb.src = ''; thumb.style.display = 'none'; }
      const delBtn = document.getElementById(`edelete-${itemId}`);
      if (delBtn) delBtn.style.display = 'none';
      for (const cat of editorCatalog) {
        for (const item of cat.items) {
          if (item.id === itemId) { delete item.image; break; }
        }
      }
    }

    async function moveItem(catId, itemId, dir) {
      const cat = editorCatalog.find(c => c.id === catId);
      if (!cat) return;
      const items = [...cat.items];
      const idx = items.findIndex(i => i.id === itemId);
      if (idx < 0) return;
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= items.length) return;
      [items[idx], items[newIdx]] = [items[newIdx], items[idx]];
      cat.items = items;
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { showEditorError(tokenError); return; }
      clearEditorError();
      const r = await fetch(`${base()}/api/admin/catalog/categories/${catId}/reorder`, {
        method: 'POST',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_ids: items.map(i => i.id) }),
      }).catch(() => { showEditorError('Не удалось подключиться.'); return null; });
      if (!r) return;
      if (!r.ok) { showEditorError(await parseError(r)); return; }
      renderEditor(editorCatalog);
    }
    function commitWtbInputs() {
      for (let i = 0; i < wtbPoints.length; i++) {
        wtbPoints[i].city     = document.getElementById(`wc-${i}`)?.value ?? wtbPoints[i].city;
        wtbPoints[i].name     = document.getElementById(`wn-${i}`)?.value ?? wtbPoints[i].name;
        wtbPoints[i].address  = document.getElementById(`wa-${i}`)?.value ?? wtbPoints[i].address;
        wtbPoints[i].schedule = document.getElementById(`ws-${i}`)?.value ?? wtbPoints[i].schedule;
        wtbPoints[i].note     = document.getElementById(`wo-${i}`)?.value ?? wtbPoints[i].note;
      }
    }

    function renderWtbPoints() {
      const el = document.getElementById('wtb-points');
      if (!el) return;
      el.innerHTML = wtbPoints.map((p, i) => `
        <div style="border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <span style="font-size:12px;font-weight:600;opacity:.5">Точка ${i+1}</span>
            <button onclick="wtbRemovePoint(${i})" style="padding:2px 8px;border:none;border-radius:4px;background:#e74c3c;color:#fff;font-size:11px;cursor:pointer">Удалить</button>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
            <label style="font-size:12px;opacity:.6">Название<br>
              <input id="wn-${i}" value="${esc(p.name||'')}" style="width:100%;padding:4px 7px;border:1px solid #ddd;border-radius:5px;font-size:13px;margin-top:2px">
            </label>
            <label style="font-size:12px;opacity:.6">Город<br>
              <input id="wc-${i}" value="${esc(p.city||'')}" style="width:100%;padding:4px 7px;border:1px solid #ddd;border-radius:5px;font-size:13px;margin-top:2px">
            </label>
            <label style="font-size:12px;opacity:.6;grid-column:span 2">Адрес<br>
              <input id="wa-${i}" value="${esc(p.address||'')}" style="width:100%;padding:4px 7px;border:1px solid #ddd;border-radius:5px;font-size:13px;margin-top:2px">
            </label>
            <label style="font-size:12px;opacity:.6">График<br>
              <input id="ws-${i}" value="${esc(p.schedule||'')}" placeholder="Пн-Пт 9:00-18:00" style="width:100%;padding:4px 7px;border:1px solid #ddd;border-radius:5px;font-size:13px;margin-top:2px">
            </label>
            <label style="font-size:12px;opacity:.6">Примечание<br>
              <input id="wo-${i}" value="${esc(p.note||'')}" placeholder="Например: лучше уточнить наличие" style="width:100%;padding:4px 7px;border:1px solid #ddd;border-radius:5px;font-size:13px;margin-top:2px">
            </label>
          </div>
        </div>
      `).join('');
    }

    function renderWtb(data) {
      if (wtbDirty) return;
      wtbPoints = (data.points || []).map(p => ({...p}));
      const body = document.getElementById('wtb-body');
      if (!body) return;
      body.innerHTML = `
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">Заголовок<br>
            <input id="wtb-title" value="${esc(data.title||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
          </label>
        </div>
        <div style="margin-bottom:16px">
          <label style="font-size:12px;opacity:.6">Описание<br>
            <textarea id="wtb-desc" rows="2" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;resize:vertical">${esc(data.description||'')}</textarea>
          </label>
        </div>
        <div id="wtb-points"></div>
      `;
      body.addEventListener('input', () => { wtbDirty = true; }, { once: true });
      body.innerHTML += `
        <button onclick="wtbAddPoint()" style="margin:8px 0;padding:6px 14px;border:none;border-radius:6px;background:#eee;color:#333;font-size:13px;cursor:pointer">+ Добавить точку</button>
        <div style="margin-top:12px">
          <button onclick="saveWtb()" style="padding:6px 16px;border:none;border-radius:6px;background:#3390ec;color:#fff;font-size:13px;cursor:pointer">Сохранить</button>
          <span id="wtb-msg" style="font-size:12px;margin-left:8px;opacity:.6"></span>
        </div>
      `;
      renderWtbPoints();
    }

    function wtbAddPoint() {
      commitWtbInputs();
      wtbPoints.push({ city: 'Оренбург', name: '', address: '', schedule: '', note: '' });
      renderWtbPoints();
    }

    function wtbRemovePoint(i) {
      commitWtbInputs();
      wtbPoints.splice(i, 1);
      renderWtbPoints();
    }

    async function saveWtb() {
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { document.getElementById('wtb-error').textContent = tokenError; return; }
      document.getElementById('wtb-error').textContent = '';
      const title       = document.getElementById('wtb-title')?.value ?? '';
      const description = document.getElementById('wtb-desc')?.value ?? '';
      const points = wtbPoints.map((_, i) => ({
        city:     document.getElementById(`wc-${i}`)?.value ?? '',
        name:     document.getElementById(`wn-${i}`)?.value ?? '',
        address:  document.getElementById(`wa-${i}`)?.value ?? '',
        schedule: document.getElementById(`ws-${i}`)?.value ?? '',
        note:     document.getElementById(`wo-${i}`)?.value ?? '',
      }));
      const msg = document.getElementById('wtb-msg');
      if (msg) msg.textContent = '…';
      const r = await fetch(`${base()}/api/admin/content/where-to-buy`, {
        method: 'PUT',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, points }),
      }).catch(() => { document.getElementById('wtb-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('wtb-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      if (msg) { msg.textContent = '✓ Сохранено'; setTimeout(() => { msg.textContent = ''; }, 2000); }
      wtbDirty = false;
    }

    function renderFb(data) {
      if (fbDirty) return;
      const body = document.getElementById('fb-body');
      if (!body) return;
      const listToText = arr => (arr || []).join('\n');
      body.innerHTML = `
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6;display:flex;align-items:center;gap:6px">
            <input id="fb-enabled" type="checkbox" ${data.enabled ? 'checked' : ''}>
            Страница включена
          </label>
        </div>
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">Заголовок<br>
            <input id="fb-title" value="${esc(data.title||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
          </label>
        </div>
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">Подзаголовок<br>
            <input id="fb-subtitle" value="${esc(data.subtitle||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
          </label>
        </div>
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">О продукте (один пункт per line)<br>
            <textarea id="fb-summary" rows="3" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;resize:vertical">${esc(listToText(data.product_summary))}</textarea>
          </label>
        </div>
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">Преимущества (один пункт per line)<br>
            <textarea id="fb-benefits" rows="3" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;resize:vertical">${esc(listToText(data.benefits))}</textarea>
          </label>
        </div>
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">Кому подходит (один пункт per line)<br>
            <textarea id="fb-who" rows="3" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;resize:vertical">${esc(listToText(data.who_its_for))}</textarea>
          </label>
        </div>
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">Шаги (один пункт per line)<br>
            <textarea id="fb-steps" rows="3" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;resize:vertical">${esc(listToText(data.steps))}</textarea>
          </label>
        </div>
        <div style="margin-bottom:10px">
          <label style="font-size:12px;opacity:.6">Примечание по документам<br>
            <textarea id="fb-docs" rows="2" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px;resize:vertical">${esc(data.docs_note||'')}</textarea>
          </label>
        </div>
        <div style="margin-bottom:10px;padding:10px;border:1px solid #eee;border-radius:8px">
          <div style="font-size:12px;font-weight:600;opacity:.5;margin-bottom:8px">Основная CTA</div>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end">
            <label style="font-size:12px;opacity:.6">Текст кнопки<br>
              <input id="fb-cta-text" value="${esc(data.cta_text||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
            </label>
            <label style="font-size:12px;opacity:.6">Режим<br>
              <select id="fb-cta-mode" style="padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
                <option value="phone" ${data.cta_mode==='phone'?'selected':''}>phone</option>
                <option value="link" ${data.cta_mode==='link'?'selected':''}>link</option>
              </select>
            </label>
            <label style="font-size:12px;opacity:.6">Значение (тел. или URL)<br>
              <input id="fb-cta-value" value="${esc(data.cta_value||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
            </label>
          </div>
        </div>
        <div style="margin-bottom:16px;padding:10px;border:1px solid #eee;border-radius:8px">
          <div style="font-size:12px;font-weight:600;opacity:.5;margin-bottom:8px">Вторичная CTA</div>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end">
            <label style="font-size:12px;opacity:.6">Текст кнопки<br>
              <input id="fb-sec-text" value="${esc(data.secondary_cta_text||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
            </label>
            <label style="font-size:12px;opacity:.6">Режим<br>
              <select id="fb-sec-mode" style="padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
                <option value="phone" ${data.secondary_cta_mode==='phone'?'selected':''}>phone</option>
                <option value="link" ${data.secondary_cta_mode==='link'?'selected':''}>link</option>
              </select>
            </label>
            <label style="font-size:12px;opacity:.6">Значение (тел. или URL)<br>
              <input id="fb-sec-value" value="${esc(data.secondary_cta_value||'')}" style="width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:2px">
            </label>
          </div>
        </div>
        <div style="margin-top:12px">
          <button onclick="saveFb()" style="padding:6px 16px;border:none;border-radius:6px;background:#3390ec;color:#fff;font-size:13px;cursor:pointer">Сохранить</button>
          <span id="fb-msg" style="font-size:12px;margin-left:8px;opacity:.6"></span>
        </div>
      `;
      body.addEventListener('input', () => { fbDirty = true; }, { once: true });
    }

    function splitLines(id) {
      return (document.getElementById(id)?.value ?? '').split('\n').map(s => s.trim()).filter(Boolean);
    }

    async function saveFb() {
      const { value: token, error: tokenError } = sanitizeToken(tok());
      if (tokenError) { document.getElementById('fb-error').textContent = tokenError; return; }
      document.getElementById('fb-error').textContent = '';
      const payload = {
        enabled:             document.getElementById('fb-enabled')?.checked ?? true,
        title:               document.getElementById('fb-title')?.value ?? '',
        subtitle:            document.getElementById('fb-subtitle')?.value ?? '',
        product_summary:     splitLines('fb-summary'),
        benefits:            splitLines('fb-benefits'),
        who_its_for:         splitLines('fb-who'),
        steps:               splitLines('fb-steps'),
        docs_note:           document.getElementById('fb-docs')?.value ?? '',
        cta_text:            document.getElementById('fb-cta-text')?.value ?? '',
        cta_mode:            document.getElementById('fb-cta-mode')?.value ?? 'phone',
        cta_value:           document.getElementById('fb-cta-value')?.value ?? '',
        secondary_cta_text:  document.getElementById('fb-sec-text')?.value ?? '',
        secondary_cta_mode:  document.getElementById('fb-sec-mode')?.value ?? 'link',
        secondary_cta_value: document.getElementById('fb-sec-value')?.value ?? '',
      };
      const msg = document.getElementById('fb-msg');
      if (msg) msg.textContent = '…';
      const r = await fetch(`${base()}/api/admin/content/for-business`, {
        method: 'PUT',
        headers: { 'X-Admin-Token': token, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }).catch(() => { document.getElementById('fb-error').textContent = 'Не удалось подключиться.'; if (msg) msg.textContent = ''; return null; });
      if (!r) return;
      if (!r.ok) { document.getElementById('fb-error').textContent = await parseError(r); if (msg) msg.textContent = ''; return; }
      if (msg) { msg.textContent = '✓ Сохранено'; setTimeout(() => { msg.textContent = ''; }, 2000); }
      fbDirty = false;
    }
  </script>
</body>
</html>
